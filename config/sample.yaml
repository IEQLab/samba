# SAMBA v2 FIRMWARE
# configure sampling and upload loop
# https://esphome.io/guides/automations.html#script-component
# written by Thomas Parkinson, May 2024


# Define script to update measurement values
script:
  - id: sensor_sample
    mode: single
    then:
      - component.update: sys_uptime
      - if:
          condition: 
            lambda: |-
              return id(sys_uptime).state > 119;
          then:
            - light.turn_on:
                id: samba_led
                transition_length: 100ms
                brightness: 25%
                red: 100%
                green: 100%
                blue: 100%
            - component.update: samba_temperature
            - component.update: samba_globe
            - component.update: samba_humidity
            - component.update: samba_airspeed
            - component.update: samba_mrt
            - component.update: samba_co2
            - component.update: samba_lux
            - component.update: samba_pm25
            - component.update: samba_tvoc
            - component.update: samba_nox
            - component.update: samba_laeq
            - component.update: samba_lamin
            - component.update: samba_lamax
            - delay: 100ms
            - sensor.template.publish:
                id: samba_temperature
                state: !lambda 'return id(samba_temperature).state;'
            - sensor.template.publish:
                id: samba_globe
                state: !lambda 'return id(samba_globe).state;'
            - sensor.template.publish:
                id: samba_humidity
                state: !lambda 'return id(samba_humidity).state;'
            - sensor.template.publish:
                id: samba_airspeed
                state: !lambda 'return id(samba_airspeed).state;'
            - sensor.template.publish:
                id: samba_mrt
                state: !lambda 'return id(samba_mrt).state;'
            - sensor.template.publish:
                id: samba_co2
                state: !lambda 'return id(samba_co2).state;'
            - sensor.template.publish:
                id: samba_lux
                state: !lambda 'return id(samba_lux).state;'
            - sensor.template.publish:
                id: samba_pm25
                state: !lambda 'return id(samba_pm25).state;'
            - sensor.template.publish:
                id: samba_tvoc
                state: !lambda 'return id(samba_tvoc).state;'
            - sensor.template.publish:
                id: samba_nox
                state: !lambda 'return id(samba_nox).state;'
            - sensor.template.publish:
                id: samba_laeq
                state: !lambda 'return id(samba_laeq).state;'
            - sensor.template.publish:
                id: samba_lamin
                state: !lambda 'return id(samba_lamin).state;'
            - sensor.template.publish:
                id: samba_lamax
                state: !lambda 'return id(samba_lamax).state;'
            - delay: 300ms
            - if:
                condition:
                  - switch.is_on: switch_influx
                then:
                  - influxdb.publish_sensors:
                      id: influx
                      sensor_ids:
                        - air_temperature
                        - globe_temperature
                        - relative_humidity
                        - air_speed
                        - radiant_temperature
                        - carbon_dioxide
                        - illuminance
                        - pm2_5
                        - tvoc
                        - nox_index
                        - laeq
                        - lamin
                        - lamax
                        - wifi_signal
                        - device_uptime
                else:
                  - logger.log:
                      format: "Influx upload skipped"
                      level: INFO
                      tag: "samba"
            - if:
                condition:
                  and:
                    - switch.is_on: switch_sdcard
                    - lambda: 'return id(sd0).is_mounted();'
                then:
                  - sd_spi_card.append_file:
                      id: sd0
                      path: !lambda 'return id(sd_filename);'
                      content: !lambda |-
                        auto t = id(ds1307_time).utcnow();
                        char ts[32];
                        t.strftime(ts, sizeof(ts), "%Y-%m-%d %H:%M:%S");

                        char buf[256];
                        snprintf(buf, sizeof(buf),
                          "%s,%.2f,%.2f,%.1f,%.3f,%.2f,%.0f,%.0f,%.1f,%.0f,%.0f,%.1f,%.1f,%.1f\n",
                          ts,
                          id(samba_temperature).state,
                          id(samba_globe).state,
                          id(samba_humidity).state,
                          id(samba_airspeed).state,
                          id(samba_mrt).state,
                          id(samba_co2).state,
                          id(samba_lux).state,
                          id(samba_pm25).state,
                          id(samba_tvoc).state,
                          id(samba_nox).state,
                          id(samba_laeq).state,
                          id(samba_lamin).state,
                          id(samba_lamax).state
                        );
                        return std::string(buf);
                else:
                  - logger.log:
                      format: "SD card write skipped"
                      level: INFO
                      tag: "samba"
            - light.turn_off:
                id: samba_led
                transition_length: 300ms
          else:
            - component.update: sys_uptime
            - logger.log: 
                format: "Warming up SAMBA device"
                level: INFO
                tag: "samba"
