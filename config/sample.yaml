# SAMBA v2 FIRMWARE
# configure sampling and upload loop
# https://esphome.io/guides/automations.html#script-component
# written by Thomas Parkinson, May 2024


# Define script to update measurement values
script:
  - id: sensor_sample
    mode: single
    then:
      - component.update: sys_uptime
      - if:
          condition: 
            lambda: |-
              return id(sys_uptime).state > 119;
          then:
            - light.turn_on:
                id: samba_led
                transition_length: 250ms
                brightness: 25%
                red: 100%
                green: 100%
                blue: 100%
            - lambda: |-
                id(samba_temperature).update();
                id(samba_globe).update();
                id(samba_humidity).update();
                id(samba_airspeed).update();
                id(samba_mrt).update();
                id(samba_co2).update();
                id(samba_lux).update();
                id(samba_pm25).update();
                id(samba_tvoc).update();
                id(samba_nox).update();
                id(samba_laeq).update();
                id(samba_la90).update();
                id(samba_la10).update();
                id(samba_la05).update();
            - delay: 200ms
            - lambda: |-
                id(samba_temperature).publish_state(id(samba_temperature).state);
                id(samba_globe).publish_state(id(samba_globe).state);
                id(samba_humidity).publish_state(id(samba_humidity).state);
                id(samba_airspeed).publish_state(id(samba_airspeed).state);
                id(samba_mrt).publish_state(id(samba_mrt).state);
                id(samba_co2).publish_state(id(samba_co2).state);
                id(samba_lux).publish_state(id(samba_lux).state);
                id(samba_pm25).publish_state(id(samba_pm25).state);
                id(samba_tvoc).publish_state(id(samba_tvoc).state);
                id(samba_nox).publish_state(id(samba_nox).state);
                id(samba_laeq).publish_state(id(samba_laeq).state);
                id(samba_la90).publish_state(id(samba_la90).state);
                id(samba_la10).publish_state(id(samba_la10).state);
                id(samba_la05).publish_state(id(samba_la05).state);
            - delay: 200ms
            - if:
                condition:
                  - switch.is_on: switch_influx
                then:
                  - influxdb.publish_sensors:
                      id: influx
                      sensor_ids:
                        - air_temperature
                        - globe_temperature
                        - relative_humidity
                        - air_speed
                        - radiant_temperature
                        - carbon_dioxide
                        - illuminance
                        - pm2_5
                        - tvoc
                        - nox_index
                        - laeq
                        - la90
                        - la10
                        - wifi_signal
                        - device_uptime
                else:
                  - logger.log:
                      format: "Influx upload skipped"
                      level: INFO
                      tag: "samba"
            - delay: 100ms
            - if:
                condition:
                  and:
                    - switch.is_on: switch_sdcard
                    - lambda: 'return id(sd0).is_mounted();'
                then:
                  - sd_spi_card.append_file:
                      id: sd0
                      path: !lambda 'return id(sd_filename);'
                      content: !lambda |-
                        auto t = id(ds1307_time).utcnow();
                        char ts[32];
                        t.strftime(ts, sizeof(ts), "%Y-%m-%d %H:%M:%S");

                        char buf[256];
                        snprintf(buf, sizeof(buf),
                          "%s,%.2f,%.2f,%.1f,%.3f,%.2f,%.0f,%.0f,%.1f,%.0f,%.0f,%.1f,%.1f,%.1f\n",
                          ts,
                          id(samba_temperature).state,
                          id(samba_globe).state,
                          id(samba_humidity).state,
                          id(samba_airspeed).state,
                          id(samba_mrt).state,
                          id(samba_co2).state,
                          id(samba_lux).state,
                          id(samba_pm25).state,
                          id(samba_tvoc).state,
                          id(samba_nox).state,
                          id(samba_laeq).state,
                          id(samba_la90).state,
                          id(samba_la10).state
                        );
                        return std::string(buf);
                else:
                  - logger.log:
                      format: "SD card write skipped"
                      level: INFO
                      tag: "samba"
            - light.turn_off:
                id: samba_led
                transition_length: 250ms
          else:
            - component.update: sys_uptime
            - logger.log: 
                format: "Warming up SAMBA device"
                level: INFO
                tag: "samba"
