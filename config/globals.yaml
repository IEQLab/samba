# SAMBA v2 FIRMWARE
# Create global parameters and restore from flash
# written by Thomas Parkinson, June 2025


# Define global variables that persist after reset
# https://esphome.io/components/globals.html
globals:
  - id: building_tag
    type: std::string
    max_restore_data_length: 24
    restore_value: yes
    initial_value: '"building"'

  - id: level_tag
    type: std::string
    max_restore_data_length: 24
    restore_value: yes
    initial_value: '"level"'

  - id: zone_tag
    type: std::string
    max_restore_data_length: 24
    restore_value: yes
    initial_value: '"zone"'

  - id: updates_enable
    type: bool
    restore_value: yes
    initial_value: 'true'

  - id: influx_enable
    type: bool
    restore_value: yes
    initial_value: 'true'

  - id: sd_enable
    type: bool
    restore_value: yes
    initial_value: 'true'

  # InfluxDB token provisioned over the native API (config/influx.yaml). Empty = use the
  # compiled-in token, or skip uploads once the build no longer carries one. InfluxDB v2
  # tokens are 88 characters; max_restore_data_length must cover that or the save is dropped.
  - id: influx_token
    type: std::string
    max_restore_data_length: 88
    restore_value: yes
    initial_value: '""'

  # CO2 calibration (y = mx + b)
  - id: calibration_co2_m
    type: double
    restore_value: yes
    initial_value: '1.0'
  - id: calibration_co2_b
    type: double
    restore_value: yes
    initial_value: '20.0'

  # Illuminance calibration
  - id: calibration_lux_m
    type: double
    restore_value: yes
    initial_value: '6.80'
  - id: calibration_lux_b
    type: double
    restore_value: yes
    initial_value: '0.0'

  # Air temperature calibration
  - id: calibration_ta_m1
    type: double
    restore_value: yes
    initial_value: '1.506'
  - id: calibration_ta_b
    type: double
    restore_value: yes
    initial_value: '-20.82'

  # RH calibration
  - id: calibration_rh_m
    type: double
    restore_value: yes
    initial_value: '1.0'
  - id: calibration_rh_b
    type: double
    restore_value: yes
    initial_value: '0.0'

  # Globe temperature calibration
  - id: calibration_tg_m
    type: double
    restore_value: yes
    initial_value: '1.472'
  - id: calibration_tg_b
    type: double
    restore_value: yes
    initial_value: '-16.12'

  # Air speed 1 calibration (power function)
  - id: calibration_as1_a
    type: double
    restore_value: yes
    initial_value: '1.343'
  - id: calibration_as1_b
    type: double
    restore_value: yes
    initial_value: '1.76'
  - id: calibration_as1_d0
    type: double
    restore_value: yes
    initial_value: '2.528'
  - id: calibration_as1_d1
    type: double
    restore_value: yes
    initial_value: '-0.059'

  # Air speed 2 calibration
  - id: calibration_as2_a
    type: double
    restore_value: yes
    initial_value: '1.297'
  - id: calibration_as2_b
    type: double
    restore_value: yes
    initial_value: '1.76'
  - id: calibration_as2_d0
    type: double
    restore_value: yes
    initial_value: '2.544'
  - id: calibration_as2_d1
    type: double
    restore_value: yes
    initial_value: '-0.054'

# Define flash write interval
# https://esphome.io/components/esphome.html#preferences-component
preferences:
  flash_write_interval: 10min
