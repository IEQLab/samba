# SAMBA v2 FIRMWARE
# Create global parameters and restore from flash
# written by Thomas Parkinson, June 2025


# Define global variables that persist after reset
# https://esphome.io/components/globals.html
globals:
  - id: building_tag
    type: std::string
    max_restore_data_length: 24
    restore_value: yes
    initial_value: '"building"'

  - id: level_tag
    type: std::string
    max_restore_data_length: 24
    restore_value: yes
    initial_value: '"level"'

  - id: zone_tag
    type: std::string
    max_restore_data_length: 24
    restore_value: yes
    initial_value: '"zone"'

  - id: updates_enable
    type: bool
    restore_value: yes
    initial_value: 'true'

  - id: influx_enable
    type: bool
    restore_value: yes
    initial_value: 'true'

  - id: sd_enable
    type: bool
    restore_value: yes
    initial_value: 'true'

  # InfluxDB token provisioned over the native API; empty = no upload
  # v2 tokens are 88 characters, which max_restore_data_length must cover
  - id: influx_token
    type: std::string
    max_restore_data_length: 88
    restore_value: yes
    initial_value: '""'

  # OTA password provisioned over the native API; empty = none
  - id: ota_password
    type: std::string
    max_restore_data_length: 64
    restore_value: yes
    initial_value: '""'

  # SD file server pairing password provisioned over the native API; empty = listener off
  - id: fileserver_password
    type: std::string
    max_restore_data_length: 32
    restore_value: yes
    initial_value: '""'

  # CO2 calibration (y = mx + b)
  - id: calibration_co2_m
    type: double
    restore_value: yes
    initial_value: '1.0'
  - id: calibration_co2_b
    type: double
    restore_value: yes
    initial_value: '20.0'

  # Illuminance calibration
  - id: calibration_lux_m
    type: double
    restore_value: yes
    initial_value: '6.80'
  - id: calibration_lux_b
    type: double
    restore_value: yes
    initial_value: '0.0'

  # Air temperature calibration
  - id: calibration_ta_m1
    type: double
    restore_value: yes
    initial_value: '1.506'
  - id: calibration_ta_b
    type: double
    restore_value: yes
    initial_value: '-20.82'

  # Globe temperature calibration
  - id: calibration_tg_m
    type: double
    restore_value: yes
    initial_value: '1.472'
  - id: calibration_tg_b
    type: double
    restore_value: yes
    initial_value: '-16.12'

  # Anemometer calibration (King's law: V^2 = (1 - k*Ta) * (A + B*v^n), config/airspeed.yaml)
  # New ids on purpose: NVS keys hash the id, so the 1.x power-law blobs are never read as these
  # TODO(v2): PLACEHOLDERS, not a fit. September-batch k=0 medians, which read level 1 ~2x high
  # and level 7 ~40% low. The real fleet medians come from the section 8 lab sessions
  # (docs/v2-release-plan.md) and change here and in the client's FIRMWARE_DEFAULTS together
  - id: calibration_as1_king_a
    type: double
    restore_value: yes
    initial_value: '0.0'
  - id: calibration_as1_king_b
    type: double
    restore_value: yes
    initial_value: '9.671'
  - id: calibration_as1_king_n
    type: double
    restore_value: yes
    initial_value: '1.173'
  - id: calibration_as1_king_k
    type: double
    restore_value: yes
    initial_value: '0.0'

  - id: calibration_as2_king_a
    type: double
    restore_value: yes
    initial_value: '0.0'
  - id: calibration_as2_king_b
    type: double
    restore_value: yes
    initial_value: '9.671'
  - id: calibration_as2_king_n
    type: double
    restore_value: yes
    initial_value: '1.173'
  - id: calibration_as2_king_k
    type: double
    restore_value: yes
    initial_value: '0.0'

# Define flash write interval
# https://esphome.io/components/esphome.html#preferences-component
preferences:
  flash_write_interval: 10min
