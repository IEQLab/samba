# SAMBA v2 FIRMWARE
# Create global parameters and restore from flash
# written by Thomas Parkinson, June 2025


# Define global variables that persist after reset
# https://esphome.io/components/globals.html
globals:
  - id: building_tag
    type: std::string
    max_restore_data_length: 24
    restore_value: yes
    initial_value: '"building"'

  - id: level_tag
    type: std::string
    max_restore_data_length: 24
    restore_value: yes
    initial_value: '"level"'

  - id: zone_tag
    type: std::string
    max_restore_data_length: 24
    restore_value: yes
    initial_value: '"zone"'

  - id: updates_enable
    type: bool
    restore_value: yes
    initial_value: 'true'

  - id: influx_enable
    type: bool
    restore_value: yes
    initial_value: 'true'

  - id: sd_enable
    type: bool
    restore_value: yes
    initial_value: 'true'

  # InfluxDB token provisioned over the native API; empty = no upload
  # v2 tokens are 88 characters, which max_restore_data_length must cover
  - id: influx_token
    type: std::string
    max_restore_data_length: 88
    restore_value: yes
    initial_value: '""'

  # OTA password provisioned over the native API; empty = none
  - id: ota_password
    type: std::string
    max_restore_data_length: 64
    restore_value: yes
    initial_value: '""'

  # SD file server pairing password provisioned over the native API; empty = listener off
  - id: fileserver_password
    type: std::string
    max_restore_data_length: 32
    restore_value: yes
    initial_value: '""'

  # CO2 calibration (y = mx + b)
  - id: calibration_co2_m
    type: double
    restore_value: yes
    initial_value: '1.0'
  - id: calibration_co2_b
    type: double
    restore_value: yes
    initial_value: '20.0'

  # Illuminance calibration; the defaults below are samba_calibration's fleet medians (2026-10-05)
  - id: calibration_lux_m
    type: double
    restore_value: yes
    initial_value: '6.669'
  - id: calibration_lux_b
    type: double
    restore_value: yes
    initial_value: '0.0'

  # Air temperature calibration: the median slope, offset reading 22 C at the median unit's raw 22 C
  - id: calibration_ta_m1
    type: double
    restore_value: yes
    initial_value: '1.034'
  - id: calibration_ta_b
    type: double
    restore_value: yes
    initial_value: '-6.78'

  # Globe temperature calibration, as Ta
  - id: calibration_tg_m
    type: double
    restore_value: yes
    initial_value: '1.010'
  - id: calibration_tg_b
    type: double
    restore_value: yes
    initial_value: '-3.25'

  # Anemometer calibration, K in v = exp(K + C1*V + G*(Ta - 22)) (config/airspeed.yaml)
  # New ids on purpose: NVS keys hash the id, so no older air speed blob is read as these
  # Each tip's median under exp2 (14 units, 2026-10-05): as2 sits about 0.25 below as1
  - id: calibration_as1_k
    type: double
    restore_value: yes
    initial_value: '-6.559'
  - id: calibration_as2_k
    type: double
    restore_value: yes
    initial_value: '-6.809'

# Define flash write interval
# https://esphome.io/components/esphome.html#preferences-component
preferences:
  flash_write_interval: 10min
