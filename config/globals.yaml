# SAMBA v2 FIRMWARE
# Create global parameters and restore from flash
# written by Thomas Parkinson, June 2025


# Define global variables that persist after reset
# https://esphome.io/components/globals.html
globals:
  - id: building_tag
    type: std::string
    max_restore_data_length: 24
    restore_value: yes
    initial_value: '"building"'

  - id: level_tag
    type: std::string
    max_restore_data_length: 24
    restore_value: yes
    initial_value: '"level"'

  - id: zone_tag
    type: std::string
    max_restore_data_length: 24
    restore_value: yes
    initial_value: '"zone"'

  - id: updates_enable
    type: bool
    restore_value: yes
    initial_value: 'true'

  - id: influx_enable
    type: bool
    restore_value: yes
    initial_value: 'true'

  - id: sd_enable
    type: bool
    restore_value: yes
    initial_value: 'true'

  # CO2 calibration (y = mx + b)
  - id: calibration_co2_m
    type: double
    restore_value: yes
    initial_value: '1.0'
  - id: calibration_co2_b
    type: double
    restore_value: yes
    initial_value: '20.0'

  # Illuminance calibration
  - id: calibration_lux_m
    type: double
    restore_value: yes
    initial_value: '7.55'
  - id: calibration_lux_b
    type: double
    restore_value: yes
    initial_value: '0.0'

  # Air temperature calibration
  - id: calibration_ta_m1
    type: double
    restore_value: yes
    initial_value: '1.545'
  - id: calibration_ta_m2
    type: double
    restore_value: yes
    initial_value: '-1.280'
  - id: calibration_ta_b
    type: double
    restore_value: yes
    initial_value: '-17.79'

  # RH calibration
  - id: calibration_rh_m
    type: double
    restore_value: yes
    initial_value: '1.0'
  - id: calibration_rh_b
    type: double
    restore_value: yes
    initial_value: '0.0'

  # Globe temperature calibration
  - id: calibration_tg_m
    type: double
    restore_value: yes
    initial_value: '1.475'
  - id: calibration_tg_b
    type: double
    restore_value: yes
    initial_value: '-16.03'

  # Air speed 1 calibration (power function)
  - id: calibration_as1_a
    type: double
    restore_value: yes
    initial_value: '1.876'
  - id: calibration_as1_b
    type: double
    restore_value: yes
    initial_value: '2.881'
  - id: calibration_as1_c
    type: double
    restore_value: yes
    initial_value: '0.00416'
  - id: calibration_as1_d0
    type: double
    restore_value: yes
    initial_value: '2.543'
  - id: calibration_as1_d1
    type: double
    restore_value: yes
    initial_value: '-0.057'

  # Air speed 2 calibration
  - id: calibration_as2_a
    type: double
    restore_value: yes
    initial_value: '2.225'
  - id: calibration_as2_b
    type: double
    restore_value: yes
    initial_value: '3.208'
  - id: calibration_as2_c
    type: double
    restore_value: yes
    initial_value: '0.00483'
  - id: calibration_as2_d0
    type: double
    restore_value: yes
    initial_value: '2.583'
  - id: calibration_as2_d1
    type: double
    restore_value: yes
    initial_value: '-0.055'

# Define flash write interval
# https://esphome.io/components/esphome.html#preferences-component
preferences:
  flash_write_interval: 1min
