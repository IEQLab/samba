# SAMBA v2 FIRMWARE
# expose calibration coefficients, identify and sample-now over the native API
# written by Thomas Parkinson, Aug 2026


# Editable calibration coefficients (mirror the persistent globals in config/globals.yaml)
# https://esphome.io/components/number/template.html
# Entity names match the deployment firmware (samba_deployment.yaml) so the samba_app
# laptop client needs a single alias table. The globals remain the only NVS copy: no
# restore_value here, and NumberCalls outside min/max are dropped by ESPHome without
# an error, so clients must validate against the advertised range first.
# disabled_by_default keeps them off a Home Assistant device page (a lay user can
# wreck a unit with them) while the native API still lists and accepts them.
number:
  - platform: template
    name: "CO2 slope [m]"
    id: cal_co2_m
    icon: mdi:molecule-co2
    entity_category: "config"
    disabled_by_default: true
    mode: box
    min_value: 0
    max_value: 2
    step: 0.001
    update_interval: 60s
    lambda: |-
      return id(calibration_co2_m);
    set_action:
      - lambda: |-
          id(calibration_co2_m) = x;
          id(cal_co2_m).publish_state(x);
      - script.execute: cal_save

