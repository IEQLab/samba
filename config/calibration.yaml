# SAMBA v2 FIRMWARE
# expose calibration coefficients, identify and sample-now over the native API
# written by Thomas Parkinson, Aug 2026


# Editable calibration coefficients (mirror the persistent globals in config/globals.yaml)
# https://esphome.io/components/number/template.html
# Out-of-range NumberCalls are dropped without an error, so clients validate the range first
number:
  - platform: template
    name: "CO2 slope [m]"
    id: cal_co2_m
    icon: mdi:molecule-co2
    entity_category: "config"
    mode: box
    min_value: 0
    max_value: 2
    step: 0.001
    update_interval: 60s
    lambda: |-
      return id(calibration_co2_m);
    set_action:
      - lambda: |-
          id(calibration_co2_m) = x;
          id(cal_co2_m).publish_state(x);
      - script.execute: cal_save

  - platform: template
    name: "CO2 offset [b]"
