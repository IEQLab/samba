# SAMBA v2 FIRMWARE
# expose calibration coefficients, identify and sample-now over the native API
# written by Thomas Parkinson, Aug 2026


# Editable calibration coefficients (mirror the persistent globals in config/globals.yaml)
# https://esphome.io/components/number/template.html
# Out-of-range NumberCalls are dropped without an error, so clients validate the range first
number:
  - platform: template
    name: "CO2 slope [m]"
    id: cal_co2_m
    icon: mdi:molecule-co2
    entity_category: "config"
    mode: box
    min_value: 0
    max_value: 2
    step: 0.001
    update_interval: 60s
    lambda: |-
      return id(calibration_co2_m);
    set_action:
      - lambda: |-
          id(calibration_co2_m) = x;
          id(cal_co2_m).publish_state(x);
      - script.execute: cal_save

  - platform: template
    name: "CO2 offset [b]"
    id: cal_co2_b
    icon: mdi:molecule-co2
    entity_category: "config"
    mode: box
    min_value: -100
    max_value: 100
    step: 0.01
    update_interval: 60s
    lambda: |-
      return id(calibration_co2_b);
    set_action:
      - lambda: |-
          id(calibration_co2_b) = x;
          id(cal_co2_b).publish_state(x);
      - script.execute: cal_save

  - platform: template
    name: "Illuminance slope [m]"
    id: cal_lux_m
    icon: mdi:sun-wireless-outline
    entity_category: "config"
    mode: box
    min_value: 0
    max_value: 15
    step: 0.01
    update_interval: 60s
    lambda: |-
      return id(calibration_lux_m);
    set_action:
      - lambda: |-
          id(calibration_lux_m) = x;
          id(cal_lux_m).publish_state(x);
      - script.execute: cal_save

  - platform: template
    name: "Illuminance offset [b]"
    id: cal_lux_b
    icon: mdi:sun-wireless-outline
    entity_category: "config"
    mode: box
    min_value: -28
    max_value: 28
    step: 0.01
    update_interval: 60s
    lambda: |-
      return id(calibration_lux_b);
    set_action:
      - lambda: |-
          id(calibration_lux_b) = x;
          id(cal_lux_b).publish_state(x);
      - script.execute: cal_save

  - platform: template
    name: "Air temperature slope [m1]"
    id: cal_ta_m1
    icon: mdi:thermometer
    entity_category: "config"
    mode: box
    min_value: 1.0
    max_value: 2.0
    step: 0.001
    update_interval: 60s
    lambda: |-
      return id(calibration_ta_m1);
    set_action:
      - lambda: |-
          id(calibration_ta_m1) = x;
          id(cal_ta_m1).publish_state(x);
      - script.execute: cal_save

  - platform: template
    name: "Air temperature offset [b]"
    id: cal_ta_b
    icon: mdi:thermometer
    entity_category: "config"
    mode: box
    min_value: -30
    max_value: 0
    step: 0.01
    update_interval: 60s
    lambda: |-
      return id(calibration_ta_b);
    set_action:
      - lambda: |-
          id(calibration_ta_b) = x;
          id(cal_ta_b).publish_state(x);
      - script.execute: cal_save

  - platform: template
    name: "Globe temperature slope [m]"
    id: cal_tg_m
    icon: mdi:thermometer
    entity_category: "config"
    mode: box
    min_value: 0
    max_value: 2
    step: 0.001
    update_interval: 60s
    lambda: |-
      return id(calibration_tg_m);
    set_action:
      - lambda: |-
          id(calibration_tg_m) = x;
          id(cal_tg_m).publish_state(x);
      - script.execute: cal_save

  - platform: template
    name: "Globe temperature offset [b]"
    id: cal_tg_b
    icon: mdi:thermometer
    entity_category: "config"
    mode: box
    min_value: -25
    max_value: 0
    step: 0.01
    update_interval: 60s
    lambda: |-
      return id(calibration_tg_b);
    set_action:
      - lambda: |-
          id(calibration_tg_b) = x;
          id(cal_tg_b).publish_state(x);
      - script.execute: cal_save

  # One K per anemometer; C1 and G are fleet constants (config/substitutions.yaml)
  - platform: template
    name: "Anemometer 1 [K]"
    id: cal_as1_k
    icon: mdi:weather-windy
    entity_category: "config"
    mode: box
    min_value: -12
    max_value: 0
    step: 0.0001
    update_interval: 60s
    lambda: |-
      return id(calibration_as1_k);
    set_action:
      - lambda: |-
          id(calibration_as1_k) = x;
          id(cal_as1_k).publish_state(x);
      - script.execute: cal_save

  - platform: template
    name: "Anemometer 2 [K]"
    id: cal_as2_k
    icon: mdi:weather-windy
    entity_category: "config"
    mode: box
    min_value: -12
    max_value: 0
    step: 0.0001
    update_interval: 60s
    lambda: |-
