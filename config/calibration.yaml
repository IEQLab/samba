# Identify and on-demand sampling
# https://esphome.io/components/button/template.html
button:
  - platform: template
    name: "Identify SAMBA"
    id: cal_identify
    icon: mdi:led-on
    device_class: identify
    entity_category: "config"
    on_press:
      - script.execute: identify_blink

  - platform: template
    name: "Sample Now"
    id: cal_sample_now
    icon: mdi:play-circle-outline
    on_press:
      - script.execute: sensor_sample

script:
  # Flush coefficients to flash now rather than waiting out flash_write_interval (10 min).
  # Same shape as tags_save (config/tags.yaml): the globals component only stages a
  # changed value from its loop(), so wait for that before syncing. mode: restart
  # debounces a burst of edits into a single NVS write.
  - id: cal_save
    mode: restart
    then:
      - delay: 2s
      - lambda: |-
          if (!global_preferences->sync()) {
            ESP_LOGE("samba", "Failed to save calibration to flash; it will revert on power cycle");
            return;
          }
          ESP_LOGI("samba",
                   "Calibration saved to flash: CO2 %.3f/%.2f Lux %.3f/%.2f Ta %.3f/%.2f RH %.3f/%.2f Tg %.3f/%.2f "
                   "AS1 %.3f/%.3f/%.3f/%.3f AS2 %.3f/%.3f/%.3f/%.3f",
                   id(calibration_co2_m), id(calibration_co2_b),
                   id(calibration_lux_m), id(calibration_lux_b),
                   id(calibration_ta_m1), id(calibration_ta_b),
                   id(calibration_rh_m), id(calibration_rh_b),
                   id(calibration_tg_m), id(calibration_tg_b),
                   id(calibration_as1_a), id(calibration_as1_b), id(calibration_as1_d0), id(calibration_as1_d1),
                   id(calibration_as2_a), id(calibration_as2_b), id(calibration_as2_d0), id(calibration_as2_d1));

  # Blink the status LED cyan for 6 s so a unit can be picked out on a bench or in a room
  - id: identify_blink
    mode: restart
    then:
      - light.turn_on:
          id: samba_led
          effect: strobe_id
      - delay: 6s
      - light.turn_off:
          id: samba_led
