      - script.execute: cal_save


# The fleet constants the firmware was built with; a client refuses a K fitted under another model
# https://esphome.io/components/text_sensor/template.html
text_sensor:
  - platform: template
    name: "Air Speed Model"
    id: cal_airspeed_model
    icon: mdi:weather-windy
    entity_category: "diagnostic"
    update_interval: never
    lambda: 'return std::string("${airspeed_model}");'

esphome:
  on_boot:
    - priority: -100
      then:
        - component.update: cal_airspeed_model


# Identify and on-demand sampling
# https://esphome.io/components/button/template.html
button:
  - platform: template
    name: "Identify SAMBA"
    id: cal_identify
    icon: mdi:led-on
    device_class: identify
    entity_category: "config"
    on_press:
      - script.execute: identify_blink

  - platform: template
    name: "Sample Now"
    id: cal_sample_now
    icon: mdi:play-circle-outline
    on_press:
      - script.execute: sensor_sample

script:
  # Flush coefficients to flash rather than waiting out flash_write_interval (10 min)
  # The delay lets the globals component stage the change before sync()
  - id: cal_save
    mode: restart
    then:
      - delay: 2s
      - lambda: |-
          if (!global_preferences->sync()) {
            ESP_LOGE("samba", "Failed to save calibration to flash; it will revert on power cycle");
            return;
          }
          ESP_LOGI("samba",
                   "Calibration saved to flash: CO2 %.3f/%.2f Lux %.3f/%.2f Ta %.3f/%.2f Tg %.3f/%.2f "
                   "AS1 K %.4f AS2 K %.4f",
                   id(calibration_co2_m), id(calibration_co2_b),
                   id(calibration_lux_m), id(calibration_lux_b),
                   id(calibration_ta_m1), id(calibration_ta_b),
                   id(calibration_tg_m), id(calibration_tg_b),
                   id(calibration_as1_k), id(calibration_as2_k));

  # Blink the status LED cyan for 6 s so a unit can be picked out on a bench or in a room
  - id: identify_blink
    mode: restart
    then:
      - light.turn_on:
          id: samba_led
          effect: strobe_id
      - delay: 6s
      - light.turn_off:
          id: samba_led
