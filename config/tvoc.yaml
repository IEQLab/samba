# SAMBA v2 FIRMWARE
# configure TVOC / NOx sensor on SAMBA
# https://esphome.io/components/sensor/sgp4x.html
# written by Thomas Parkinson, May 2024

# Define sensor
sensor:
  - platform: sgp4x
    id: sgp41
    update_interval: 30s
    compensation:
      temperature_source: sht_temperature
      humidity_source: sht_humidity
    voc_index:
      id: sgp_voc
      internal: true
      algorithm_tuning:
        learning_time_offset_hours: 720
      filters:
        - filter_out: nan
        - median:
            window_size: 8
            send_every: 2
            send_first_at: 1
        - clamp:
            max_value: 500
            ignore_out_of_range: false
      on_raw_value:
        # warning flag as well as isnan(x): a NACKed request keeps firing with a frozen value
        - lambda: 'if (!std::isnan(x) && !id(sgp41).status_has_warning()) id(sgp_last_ok) = millis();'
    nox_index:
      id: sgp_nox
      internal: true
      filters:
        - filter_out: nan
        - median:
            window_size: 8
            send_every: 2
            send_first_at: 1

# Define TVOC measurements
  - platform: template
    id: samba_tvoc
    name: "TVOC"
    update_interval: never
    accuracy_decimals: 0
    device_class: volatile_organic_compounds_parts
    unit_of_measurement: "ppb"
    icon: mdi:radiator
    lambda: |-
      // Drop out after a full sample interval of silence
      if (id(sgp_last_ok) == 0 || (millis() - id(sgp_last_ok)) > 330000)
        return NAN;
      return (log(501.0 - id(sgp_voc).state) - 6.24) * (-381.97);
    
# Define NOx measurements
  - platform: template
    id: samba_nox
    name: "NOx Index"
    update_interval: never
    accuracy_decimals: 0
    device_class: aqi
    icon: mdi:radiator
    lambda: |-
      if (id(sgp_last_ok) == 0 || (millis() - id(sgp_last_ok)) > 330000)
        return NAN;
      return id(sgp_nox).state;


# Error counter for initialisation failure recovery
globals:
# millis() of the last successful raw read
  - id: sgp_last_ok
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: sgp_error_count
    type: int
    restore_value: no
    initial_value: '0'
# Latches the warmup guard below, so the 49.7-day millis() rollover cannot re-engage it.
  - id: sgp_warmed
    type: bool
    restore_value: no
    initial_value: 'false'
# Hour-scale failure duty cycle, diagnostic only
  - id: sgp_unhealthy
    type: float
    restore_value: no
    initial_value: '0.0f'

# Track failures and report a sustained fault. No restart - see the lambda (after 150s warmup)
interval:
  - interval: 30s
    then:
      - lambda: |-
          // No value yet, or the last poll failed; both set the warning flag
          const bool failed = std::isnan(id(sgp_voc).state) || id(sgp41).status_has_warning();

          // Skip error counting during warmup; latched against the millis() rollover
          if (!id(sgp_warmed)) {
            if (millis() < 150000) {
              ESP_LOGD("samba", "SGP4x sensor warming up - skipping error check");
              return;
            }
            id(sgp_warmed) = true;
          }

          // Seconds failed per hour: EWMA over one hour, diagnostic only
          id(sgp_unhealthy) = (id(sgp_unhealthy) + (failed ? 30.0f : 0.0f)) * 0.9916667f;

          if (failed) {
            id(sgp_error_count)++;

            // No restart: a reboot would discard the gas baseline, and NaN already costs only VOC/NOx
            if (id(sgp_error_count) == 6) {
              ESP_LOGE("samba", "SGP4x failed 6 consecutive polls, %.0f percent of the last hour",
                       id(sgp_unhealthy) / 36.0f);
            } else {
              ESP_LOGW("samba", "SGP4x sensor failure %d", id(sgp_error_count));
            }

            // LED handled by the arbiter in led.yaml

          } else {
            if (id(sgp_error_count) > 0) {
              ESP_LOGI("samba", "SGP4x sensor recovered");
            }
            id(sgp_error_count) = 0;
          }
