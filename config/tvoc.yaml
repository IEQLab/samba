# SAMBA v2 FIRMWARE
# configure TVOC / NOx sensor on SAMBA
# https://esphome.io/components/sensor/sgp4x.html
# written by Thomas Parkinson, May 2024

# Define sensor
sensor:
  - platform: sgp4x
    id: sgp41
    update_interval: 30s
    compensation:
      temperature_source: sht_temperature
      humidity_source: sht_humidity
    voc_index:
      id: sgp_voc
      internal: true
      algorithm_tuning:
        learning_time_offset_hours: 720
      filters:
        - filter_out: nan
        - median:
            window_size: 8
            send_every: 2
            send_first_at: 1
        - clamp:
            max_value: 500
            ignore_out_of_range: false
      on_raw_value:
        # VOC and NOx come from the same sgp41 measurement, so one timestamp covers both.
        - lambda: 'if (!std::isnan(x)) id(sgp_last_ok) = millis();'
    nox_index:
      id: sgp_nox
      internal: true
      filters:
        - filter_out: nan
        - median:
            window_size: 8
            send_every: 2
            send_first_at: 1

# Define TVOC measurements
  - platform: template
    id: samba_tvoc
    name: "TVOC"
    update_interval: never
    accuracy_decimals: 0
    device_class: volatile_organic_compounds_parts
    unit_of_measurement: "ppb"
    icon: mdi:radiator
    lambda: |-
      // sgp4x publishes nothing after a failed read (sgp_voc keeps its last value) but flags
      // a warning until the next good read. Report NaN so a dead sensor shows as unknown in
      // Home Assistant, nan on the SD card, and is left out of the InfluxDB upload.
      // status_has_warning() is set by one failed read and cleared by the next good one, so
      // testing it threw away a whole cycle for a single transient failure. VOC and NOx move
      // slowly and the 8-wide median carries them; report NaN only once the sensor has been
      // silent for a full sample interval.
      if (id(sgp_last_ok) == 0 || (millis() - id(sgp_last_ok)) > 330000)
        return NAN;
      return (log(501.0 - id(sgp_voc).state) - 6.24) * (-381.97);
    
# Define NOx measurements
  - platform: template
    id: samba_nox
    name: "NOx Index"
    update_interval: never
    accuracy_decimals: 0
    device_class: aqi
    icon: mdi:radiator
    lambda: |-
      if (id(sgp_last_ok) == 0 || (millis() - id(sgp_last_ok)) > 330000)
        return NAN;
      return id(sgp_nox).state;


# Error counter for initialisation failure recovery
globals:
# millis() of the last successful raw read; uint32_t subtraction wraps correctly.
  - id: sgp_last_ok
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: sgp_error_count
    type: int
    restore_value: no
    initial_value: '0'

# Restart after 3 consecutive failures (after 100s warmup)
interval:
  - interval: 30s
    then:
      - lambda: |-
          // Check if VOC sensor is returning valid data: no value yet (boot), or the last
          // read failed (sgp4x keeps the old value but flags a warning)
          if (std::isnan(id(sgp_voc).state) || id(sgp41).status_has_warning()) {

            // Skip error counting during 100s warmup period
            if (millis() < 100000) {
              ESP_LOGD("samba", "SGP4x sensor warming up - skipping error check");
              return;
            }

            id(sgp_error_count)++;
            ESP_LOGW("samba", "SGP4x sensor failure %d", id(sgp_error_count));

            // Warning LED at 4 failures (magenta, dim)
            if (id(sgp_error_count) == 4) {
              // Pulse, not solid - see co2.yaml.
              auto call = id(samba_led).turn_on();
              call.set_effect("pulse_slow");
              call.set_rgb(1.0, 0.0, 1.0);
              call.perform();
            }

            // Error LED at 6 failures (magenta, bright) then restart
            if (id(sgp_error_count) >= 6) {
              auto call = id(samba_led).turn_on();
              call.set_effect("none");
              call.set_rgb(1.0, 0.0, 1.0);
              call.set_brightness(0.25);
              call.perform();

              // As with the K30: NaN propagates upstream, so a dead SGP4x costs only VOC/NOx.
              // Restart at most hourly rather than turning one sensor into a total outage.
              if (id(sys_uptime).state > 3600) {
                ESP_LOGE("samba", "SGP4x sensor failed after 1h uptime - restarting to attempt recovery");
                id(sys_restart).press();
              }
            }

          } else {
            if (id(sgp_error_count) > 0) {
              id(samba_led).turn_off();
            }
            id(sgp_error_count) = 0;
          }
