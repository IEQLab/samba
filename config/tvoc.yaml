# SAMBA v2 FIRMWARE
# configure TVOC / NOx sensor on SAMBA
# https://esphome.io/components/sensor/sgp4x.html
# written by Thomas Parkinson, May 2024


# Define sensor
sensor:
  - platform: sgp4x
    update_interval: 30s
    compensation:
      temperature_source: sht_temperature
      humidity_source: sht_humidity
    voc:
      id: sgp_voc
      internal: true
      algorithm_tuning:
        learning_time_offset_hours: 720
      filters:
        - filter_out: nan
        - median:
            window_size: 10
            send_every: 2
            send_first_at: 1
    nox:
      id: sgp_nox
      internal: true
      filters:
        - filter_out: nan
        - median:
            window_size: 10
            send_every: 2
            send_first_at: 1

# Define TVOC measurements
  - platform: template
    id: samba_tvoc
    name: "TVOC"
    update_interval: never
    accuracy_decimals: 0
    device_class: volatile_organic_compounds_parts
    unit_of_measurement: "ppb"
    icon: mdi:radiator
    lambda: |-
      return (log(501.0 - id(sgp_voc).state) - 6.24) * (-381.97);
    
# Define NOx measurements
  - platform: template
    id: samba_nox
    name: "NOx Index"
    update_interval: never
    accuracy_decimals: 0
    device_class: aqi
    icon: mdi:radiator
    lambda: |-
      return id(sgp_nox).state;


# Error counter for initialisation failure recovery
globals:
  - id: sgp_error_count
    type: int
    restore_value: no
    initial_value: '0'

# Restart after 3 consecutive failures
interval:
  - interval: 30s
    then:
      - lambda: |-
          // Check if VOC sensor is returning valid data
          if (std::isnan(id(sgp_voc).state)) {

            id(sgp_error_count)++;
            ESP_LOGW("samba", "SGP4x sensor failure %d/3", id(sgp_error_count));

            // Warning LED at 2 failures (purple)
            if (id(sgp_error_count) == 2) {
              auto call = id(samba_led).turn_on();
              call.set_effect("none");
              call.set_rgb(0.6, 0.0, 0.8);
              call.set_brightness(0.5);
              call.perform();
            }

            // Error LED at 3 failures (magenta) then restart
            if (id(sgp_error_count) >= 3) {
              auto call = id(samba_led).turn_on();
              call.set_effect("none");
              call.set_rgb(1.0, 0.0, 0.6);
              call.set_brightness(1.0);
              call.perform();

              ESP_LOGE("samba", "SGP4x sensor failed - restarting device");
              id(sys_restart).press();
            }

          } else {
            if (id(sgp_error_count) > 0) {
              id(samba_led).turn_off();
            }
            id(sgp_error_count) = 0;
          }
