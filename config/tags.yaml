# SAMBA v2 FIRMWARE
# expose InfluxDB tags as editable Home Assistant entities
# written by Thomas Parkinson, Aug 2026


# Editable tag fields (mirror the persistent globals set by the setup firmware)
# https://esphome.io/components/text/template.html
# max_length must stay <= max_restore_data_length on the backing global, or the save is dropped
text:
  - platform: template
    name: "Building"
    id: text_building
    icon: mdi:office-building
    entity_category: "config"
    mode: text
    min_length: 1
    max_length: 24
    pattern: "^[A-Za-z0-9_-]+$"
    update_interval: 60s
    lambda: |-
      return id(building_tag);
    set_action:
      - script.execute:
          id: tag_set
          key: "building"
          raw: !lambda 'return x;'

  - platform: template
    name: "Level"
    id: text_level
    icon: mdi:elevator-passenger-outline
    entity_category: "config"
    mode: text
    min_length: 1
    max_length: 24
    pattern: "^[A-Za-z0-9_-]+$"
    update_interval: 60s
    lambda: |-
      return id(level_tag);
    set_action:
      - script.execute:
          id: tag_set
          key: "level"
          raw: !lambda 'return x;'

  - platform: template
    name: "Zone"
    id: text_zone
    icon: mdi:floor-plan
    entity_category: "config"
    mode: text
    min_length: 1
    max_length: 24
    pattern: "^[A-Za-z0-9_-]+$"
    update_interval: 60s
    lambda: |-
      return id(zone_tag);
    set_action:
      - script.execute:
          id: tag_set
          key: "zone"
          raw: !lambda 'return x;'

script:
  # Sanitise, store and echo back a tag value
  # ESPHome validates length only, never the `pattern` above, so scrub rather than trust
  - id: tag_set
    mode: queued
    max_runs: 3
    parameters:
      key: string
      raw: string
    then:
      - lambda: |-
          // Keep [A-Za-z0-9_-], collapse other runs to one underscore, trim, cap at 24
          std::string out;
          out.reserve(raw.size());
          bool pending_us = false;
          for (char c : raw) {
            bool keep = (c >= '0' && c <= '9') || (c >= 'A' && c <= 'Z') ||
                        (c >= 'a' && c <= 'z') || c == '-' || c == '_';
            if (keep) {
              out += c;
              pending_us = false;
            } else if (!pending_us && !out.empty()) {
              out += '_';
              pending_us = true;
            }
          }
          if (out.size() > 24)
            out.resize(24);
          while (!out.empty() && out.back() == '_')
            out.pop_back();

          // Nothing usable left, so put the stored value back and the UI reverts
          if (out.empty()) {
            ESP_LOGW("samba", "Rejected tag %s: '%s' has no usable characters", key.c_str(), raw.c_str());
            if (key == "building") id(text_building).publish_state(id(building_tag));
            else if (key == "level") id(text_level).publish_state(id(level_tag));
            else id(text_zone).publish_state(id(zone_tag));
            return;
          }

          if (out != raw)
            ESP_LOGW("samba", "Sanitised tag %s: '%s' -> '%s'", key.c_str(), raw.c_str(), out.c_str());

          if (key == "building") {
            id(building_tag) = out;
            id(text_building).publish_state(out);
          } else if (key == "level") {
            id(level_tag) = out;
            id(text_level).publish_state(out);
          } else {
            id(zone_tag) = out;
            id(text_zone).publish_state(out);
          }
      - script.execute: tags_save

  # Flush tags to flash rather than waiting out flash_write_interval (10 min)
  # The delay lets the globals component stage the change before sync()
  - id: tags_save
    mode: restart
    then:
      - delay: 2s
      - lambda: |-
          if (!global_preferences->sync()) {
            ESP_LOGE("samba", "Failed to save tags to flash; they will revert on power cycle");
            return;
          }
          ESP_LOGI("samba", "Tags saved to flash: building=%s level=%s zone=%s",
                   id(building_tag).c_str(), id(level_tag).c_str(), id(zone_tag).c_str());
      # The SD header records tags at creation, so start a new file when they change
      - lambda: 'id(sd_logfile) = false;'
      - if:
          condition:
            time.has_time:
              id: ds1307_time
          then:
            - script.execute: sd_create
