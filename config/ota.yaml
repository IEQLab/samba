# SAMBA v2 FIRMWARE
# configure over-the-air update support
# written by Thomas Parkinson, May 2024


# Enable OTA access
# https://esphome.io/components/ota.html
ota:
  - platform: esphome
    id: ota_esphome
    # Compiled-in fallback; a password provisioned over the native API takes precedence
    # Keep `password:` present even when "" so ESPHome compiles the auth path
    password: "${ota_password}"
    on_begin:
      then:
        - logger.log: 
            format: "Updating SAMBA through esphome"
            tag: "samba"
  - platform: http_request
    on_progress:
      then:
        - logger.log:
            format: "OTA progress: %0.1f%%"
            args: ["x"]
            level: INFO
            tag: "samba"

# Enable managed updates
# https://esphome.io/components/update/http_request.html#
update:
  - platform: http_request
    id: fw_update
    name: "Firmware"
    source: https://github.com/IEQLab/samba/raw/main/firmware/manifest_v2.json
    update_interval: 12h

# Enable HTTP Request component for OTA and Influx
# https://esphome.io/components/http_request.html
http_request:
    id: http_client
    verify_ssl: true
    timeout: 8s
    # Must exceed twice the timeout - http_request feeds the WDT once for the whole request
    watchdog_timeout: 30s
    buffer_size_tx: 1024   # request line + headers incl. the InfluxDB token exceed the 512 default

# Explicitly enable safe mode
# https://esphome.io/components/safe_mode
safe_mode:
  on_safe_mode:
    then:
      # Never reference another component by id here - it half-wires setup() and bricks the unit
      - logger.log: "Restoring SAMBA due to an unknown error"

# Provision the OTA password over the native API (`samba deploy`), one per building
# Lives in the ota_password global and takes precedence over the compiled-in one
esphome:
  on_boot:
    # after the globals are restored (HARDWARE); set_auth_password only stores the string
    - priority: 600
      then:
        - lambda: |-
            if (!id(ota_password).empty())
              id(ota_esphome).set_auth_password(id(ota_password));

api:
  actions:
    - action: ota_set_password
      variables:
        password: string
      then:
        - lambda: |-
            // An empty password clears the provisioned one
            if (password.size() > 64) {
              ESP_LOGW("samba", "Rejected OTA password: %u characters", (unsigned) password.size());
              return;
            }
            for (char c : password) {
              if (c <= ' ' || c > '~') {
                ESP_LOGW("samba", "Rejected OTA password: not printable ASCII");
                return;
              }
            }
            id(ota_password) = password;
            id(ota_esphome).set_auth_password(password.empty() ? std::string("${ota_password}") : password);
            id(ota_password_fp).update();
            ESP_LOGI("samba", "OTA password %s (fingerprint %s)",
                     password.empty() ? "cleared" : "set", id(ota_password_fp).get_state().c_str());
        - script.execute: ota_password_save

text_sensor:
  # Fingerprint of the provisioned OTA password, or "unset" when none
  - platform: template
    name: "OTA Password"
    id: ota_password_fp
    icon: mdi:key-outline
    entity_category: "diagnostic"
    update_interval: 60s
    lambda: |-
      if (id(ota_password).empty())
        return std::string("unset");
      char buf[9];
      snprintf(buf, sizeof(buf), "%08x", (unsigned) esphome::fnv1_hash(id(ota_password)));
      return std::string(buf);

# Store jitter delay as a global variable
globals:
  - id: fw_jitter_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Define script to scatter firmware update checks
script:
  # Flush the OTA password to flash
  - id: ota_password_save
    mode: restart
    then:
      - delay: 2s
      - lambda: |-
          if (!global_preferences->sync()) {
            ESP_LOGE("samba", "Failed to save OTA password to flash; it will revert on power cycle");
            return;
          }
          ESP_LOGI("samba", "OTA password saved to flash");

  - id: fw_check
    mode: queued
    then:
      - if:
          condition:
            and:
              - update.is_available: fw_update
              - switch.is_on: switch_updates
          then:
            # compute 0 to 10 min jitter
            - lambda: |-
                id(fw_jitter_ms) = esp_random() % (10 * 60 * 1000);
            - logger.log:
                format: "Update available; jitter = %u ms"
                args: ['(unsigned) id(fw_jitter_ms)']
                level: INFO
                tag: "samba"
            # yield to scheduler for the jitter duration
            - delay: !lambda 'return id(fw_jitter_ms);'
            - update.perform:
                id: fw_update
          else:
            - logger.log: 
                format: "No update available"
                level: INFO
                tag: "samba"

# Toggle automatic FW updates
switch:
  - platform: template
    name: "Automatic Updates"
    id: switch_updates
    icon: mdi:update
    entity_category: "config"
    restore_mode: DISABLED
    lambda: |-
      return id(updates_enable);
    turn_on_action:
      - lambda: 'id(updates_enable) = true;'
    turn_off_action:
      - lambda: 'id(updates_enable) = false;'
