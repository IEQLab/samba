# SAMBA v2 FIRMWARE
# configure over-the-air update support
# written by Thomas Parkinson, May 2024


# Enable OTA access
# https://esphome.io/components/ota.html
ota:
  - platform: esphome
    password: "${ota_password}"
    on_begin:
      then:
        - logger.log: 
            format: "Updating SAMBA through esphome"
            tag: "samba"
  - platform: http_request
    on_progress:
      then:
        - logger.log:
            format: "OTA progress: %0.1f%%"
            args: ["x"]
            level: INFO
            tag: "samba"

# Enable managed updates
# https://esphome.io/components/update/http_request.html#
update:
  - platform: http_request
    id: fw_update
    name: "Firmware"
    source: https://github.com/IEQLab/samba/raw/main/firmware/manifest.json
    update_interval: 12h

# Enable HTTP Request component for OTA and Influx
# https://esphome.io/components/http_request.html
http_request:
    id: http_client
    verify_ssl: true
    timeout: 8s
    # Must exceed the worst-case blocking span, not one operation. http_request raises the WDT
    # once for the whole request, then runs esp_http_client_open (DNS, TCP, TLS, headers) and
    # the body write with no feed between them - two 8s socket timeouts back to back, and DNS
    # is not bounded by `timeout` at all. ESPHome forces CONFIG_ESP_TASK_WDT_PANIC, so an
    # overrun is a reboot, not a log line.
    watchdog_timeout: 30s
    buffer_size_tx: 1024   # request line + headers incl. the InfluxDB token exceed the 512 default

# Explicitly enable safe mode
# https://esphome.io/components/safe_mode
safe_mode:
  on_safe_mode:
    then:
      # Actions here must not reference another component by id. Doing so makes
      # safe_mode's own codegen wait on that id, which pushes the early return in
      # setup() into the middle of the component block - components then get set up
      # before their pointers are assigned and the device crashes on every boot.
      # logger.log is safe because it waits on nothing.
      - logger.log: "Restoring SAMBA due to an unknown error"

# Store jitter delay as a global variable
globals:
  - id: fw_jitter_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Define script to scatter firmware update checks
script:
  - id: fw_check
    mode: queued
    then:
      - if:
          condition:
            and:
              - update.is_available: fw_update
              - switch.is_on: switch_updates
          then:
            # compute 0 to 10 min jitter
            - lambda: |-
                id(fw_jitter_ms) = esp_random() % (10 * 60 * 1000);
            - logger.log:
                format: "Update available; jitter = %u ms"
                args: ['(unsigned) id(fw_jitter_ms)']
                level: INFO
                tag: "samba"
            # yield to scheduler for the jitter duration
            - delay: !lambda 'return id(fw_jitter_ms);'
            - update.perform:
                id: fw_update
          else:
            - logger.log: 
                format: "No update available"
                level: INFO
                tag: "samba"

# Toggle automatic FW updates
switch:
  - platform: template
    name: "Automatic Updates"
    id: switch_updates
    icon: mdi:update
    entity_category: "config"
    restore_mode: DISABLED
    lambda: |-
      return id(updates_enable);
    turn_on_action:
      - lambda: 'id(updates_enable) = true;'
    turn_off_action:
      - lambda: 'id(updates_enable) = false;'
