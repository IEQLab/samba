# SAMBA v2 FIRMWARE
# configure OPT3001 light sensor
# written by Thomas Parkinson, May 2024


# Define sensor
# https://esphome.io/components/sensor/opt3001
sensor:
  - platform: opt3001
    id: opt_lux
    update_interval: 20s
    internal: true
    address: 0x45
    on_raw_value:
      # Timestamp every successful raw read. opt3001 publishes NaN on a read error, which the
      # filter_out below drops, so without this .state freezes at its last good value.
      - lambda: 'if (!std::isnan(x)) id(opt_last_ok) = millis();'
    filters:
      - filter_out: nan
      - clamp:
          min_value: 0
          max_value: 20000
          ignore_out_of_range: true
      - median:
          window_size: 15
          send_every: 3
          send_first_at: 1


# Define illuminance measurements
  - platform: template
    id: samba_lux
    name: "Illuminance"
    update_interval: never
    accuracy_decimals: 0
    device_class: illuminance
    unit_of_measurement: "lx"
    icon: mdi:sun-wireless-outline
    filters:
      - lambda: |-
          // NaN so a dead sensor shows as unknown in HA, nan on the SD card, and is left out
          // of the upload. Only after a full sample interval of silence - the 20s poll and
          // 15-wide median carry illuminance through sixteen consecutive failed reads.
          if (id(opt_last_ok) == 0 || (millis() - id(opt_last_ok)) > 330000)
            return NAN;
          return ((id(calibration_lux_m) * id(opt_lux).state) + id(calibration_lux_b));


# millis() of the last successful raw read
globals:
  - id: opt_last_ok
    type: uint32_t
    restore_value: no
    initial_value: '0'
