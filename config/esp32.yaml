# SAMBA v2 FIRMWARE
# configure ESP microcontroller
# written by Thomas Parkinson, May 2024


# Define ESP32 board
# https://www.espressif.com/sites/default/files/documentation/esp32-wroom-32e_esp32-wroom-32ue_datasheet_en.pdf
esp32:
  variant: esp32
#  board: esp32dev
  flash_size: 16MB
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FATFS_LFN_NONE: "n"
      CONFIG_FATFS_LFN_HEAP: "y"
      CONFIG_FATFS_MAX_LFN: "255"
    advanced:
      include_builtin_idf_components: ["fatfs"]
      disable_vfs_support_termios: false
      disable_vfs_support_select: false
      disable_vfs_support_dir: false
      minimum_chip_revision: "3.1"

# Define initialisation code
# https://esphome.io/components/esphome/#on_boot
esphome:
  on_boot:
    - priority: 100
      then: 
        - light.turn_on:
            id: samba_led
            effect: strobe_g
        - component.update: sys_uptime
        - delay: 1000ms
    - priority: -100
      then:
      
        # Synchronise system to RTC clock
        - delay: 200ms
        - ds1307.read_time:
        


# Configure i2c bus
# https://esphome.io/components/i2c
i2c:
  - id: bus_a
    scl: GPIO25
    sda: GPIO26
    scan: false
    frequency: 50kHz
    timeout: 13ms

# I2C runtime bus recovery (custom component)
# Clears a bus wedged by an aborted clock-stretching target (e.g. the K30). ESPHome clocks
# the bus out only once, during setup, so there is otherwise no way back short of a reboot.
#
# port: 0 - IDFI2CBus::setup() assigns HP ports sequentially from I2C_NUM_0, and bus_a is the
# only HP bus here, so it owns port 0. reset_bus() looks the handle up with
# i2c_master_get_bus_handle() and logs an error if that ever stops being true.
#
# min_interval: 30s - one reset per NTC read cycle. ads_error_count only clears once all
# three ADS1115 channels have read successfully, and the NTC channel updates every 30s, so
# 30s is the shortest interval over which a reset can be judged to have worked. Resetting
# faster would re-reset the peripheral before the evidence arrives, and would disturb the
# four other targets sharing bus_a (RTC, SHT4x, K30, OPT3001) more often for no gain. It
# still allows 5 attempts in the 2min between the amber warning and the red error.
i2c_recovery:
  id: i2c_recovery_a
  port: 0
  min_interval: 30s

# Configure UART bus
# https://esphome.io/components/uart
uart:
  - id: uart_pm
    rx_pin: GPIO16
    tx_pin: GPIO17
    baud_rate: 9600
