# SAMBA v2 FIRMWARE
# configure ESP microcontroller
# written by Thomas Parkinson, May 2024


# Define ESP32 board
# https://www.espressif.com/sites/default/files/documentation/esp32-wroom-32e_esp32-wroom-32ue_datasheet_en.pdf
esp32:
  variant: esp32
#  board: esp32dev
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FATFS_LFN_NONE: "n"
      CONFIG_FATFS_LFN_HEAP: "y"
      CONFIG_FATFS_MAX_LFN: "255"
    advanced:
      include_builtin_idf_components: ["fatfs"]
      disable_vfs_support_termios: false
      disable_vfs_support_select: false
      disable_vfs_support_dir: false
      minimum_chip_revision: "3.1"

# Define initialisation code
# https://esphome.io/components/esphome/#on_boot
esphome:
  on_boot:
    - priority: 100
      then: 
        - light.turn_on:
            id: samba_led
            effect: strobe_g
        - component.update: sys_uptime
        - delay: 1000ms
    - priority: -100
      then:
      
        # Synchronise system to RTC clock
        - delay: 200ms
        - ds1307.read_time:
        
        # Print useful diagnostics
        - lambda: |-
            char msg[768];
        
            snprintf(
              msg, sizeof(msg),
              "Building: %s, Level: %s, Zone: %s, Time: %s\n"
              "Influx: %s, SD Card: %s, Updates: %s\n"
              "Calibrations:\n"
              "CO2:  y = ppm*%.4fx + %.4f\n"
              "Lux:  y = lux*%.4fx + %.4f\n"
              "Ta:   y = ta*%.4fx + pms*%.4fx + %.4f\n"
              "RH:   y = rh*%.4fx + %.4f\n"
              "Tg:   y = tg*%.4fx + %.4f\n"
              "AS1:  y = %.6f * V^%.6f + %.4f * V * ta; d0 = %.3f, d1 = %.3f\n"
              "AS2:  y = %.6f * V^%.6f + %.4f * V * ta; d0 = %.3f, d1 = %.3f",
              id(building_tag).c_str(),
              id(level_tag).c_str(),
              id(zone_tag).c_str(),
              ESPTime::from_epoch_utc(id(ds1307_time).now().timestamp)
                .strftime("%Y-%m-%dT%H:%M:%S+00:00").c_str(),
              id(influx_enable) ? "true" : "false",
              id(sd_enable) ? "true" : "false",
              id(updates_enable) ? "true" : "false",
              id(calibration_co2_m), id(calibration_co2_b),
              id(calibration_lux_m), id(calibration_lux_b),
              id(calibration_ta_m1), id(calibration_ta_m2), id(calibration_ta_b),
              id(calibration_rh_m), id(calibration_rh_b),
              id(calibration_tg_m), id(calibration_tg_b),
              id(calibration_as1_a), id(calibration_as1_b), id(calibration_as1_c), id(calibration_as1_d0), id(calibration_as1_d1),
              id(calibration_as2_a), id(calibration_as2_b), id(calibration_as2_c), id(calibration_as2_d0), id(calibration_as2_d1)
            );
        
            ESP_LOGI("samba", "%s", msg);


# Configure i2c bus
# https://esphome.io/components/i2c
# NOTE: Remote ADC (ADS1115) may experience I2C timeouts due to slow rise times
# caused by 590Ω series resistors (R2, R3, R8, R9) on differential I2C lines.
# Hardware fix: Replace R2, R3, R8, R9 with 22-47Ω resistors.
# Optional: Replace R4, R5 pull-ups from 5.1kΩ to 2.2kΩ for faster rise times.
i2c:
  - id: bus_a
    scl: GPIO25
    sda: GPIO26
    scan: false
    frequency: 50kHz
    timeout: 13ms

# Configure UART bus
# https://esphome.io/components/uart
uart:
  - id: uart_pm
    rx_pin: GPIO16
    tx_pin: GPIO17
    baud_rate: 9600
