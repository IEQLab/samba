# SAMBA v2 FIRMWARE
# Set subtitutions for individual configurations
# written by Thomas Parkinson, June 2025


# Define substitutions for configuration
# https://esphome.io/components/substitutions.html#command-line-substitutions
substitutions:
  
  # Influx config; the token is provisioned at runtime (config/influx.yaml)
  influx_host: !secret influx_host
  influx_port: !secret influx_port
  influx_org: !secret influx_org
  influx_bucket: !secret influx_bucket

  # Air speed fleet constants, v = exp(K + C1*V + G*(Ta - 22)), from samba_calibration's analysis/airspeed_fleet.R
  airspeed_model: "exp1"
  airspeed_c1: "3.0043"
  airspeed_g: "0.2321"
