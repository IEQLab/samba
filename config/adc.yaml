# SAMBA v2 FIRMWARE
# configure analog-to-digital converter on remote board
# https://esphome.io/components/sensor/ads1115.html
# written by Thomas Parkinson, May 2024


# Define component
ads1115:
  - address: 0x4B
    continuous_mode: off
    id: ads_dac

# Define raw measurements for sensors
sensor:
# Air speed sensor 1
  - platform: ads1115
    ads1115_id: ads_dac
    id: ads_as1
    multiplexer: 'A0_GND'
    gain: 6.144
    sample_rate: 64
    update_interval: 2s
    internal: true
    on_value:
      - lambda: 'id(ads_as1_last_ok) = millis();'

# Air speed sensor 2
  - platform: ads1115
    ads1115_id: ads_dac
    id: ads_as2
    multiplexer: 'A1_GND'
    gain: 6.144
    sample_rate: 64
    update_interval: 2s
    internal: true
    on_value:
      - lambda: 'id(ads_as2_last_ok) = millis();'

# NTC thermistor
  - platform: ads1115
    ads1115_id: ads_dac
    id: ads_ntc
    multiplexer: 'A2_GND'
    gain: 6.144
    sample_rate: 16
    update_interval: 30s
    internal: true
    on_value:
      - lambda: 'id(ads_ntc_last_ok) = millis();'

# ADS1115 error counter: 2s stale ticks. Not isnan() - a failed read is never published
  - platform: template
    id: ads_error_count
    internal: true
    update_interval: 2s
    accuracy_decimals: 0
    lambda: |-
      const uint32_t now = millis();
      const bool as1_stale = (now - id(ads_as1_last_ok)) > 6000;
      const bool as2_stale = (now - id(ads_as2_last_ok)) > 6000;
      const bool ntc_stale = (now - id(ads_ntc_last_ok)) > 90000;
      const bool stale = as1_stale || as2_stale || ntc_stale;

      // Seconds stale per hour: EWMA with a one-hour time constant, so steady state is
      // 3600 * duty cycle. Gates the restart only; errors here come in waves and a reboot
      // must not react to one. The 1250 threshold in ads_restart_due is a sustained 35%.
      id(ads_unhealthy) = (id(ads_unhealthy) + (stale ? 2.0f : 0.0f)) * 0.9994444f;

      // Consecutive-failure ticks, driving the LED. Any successful read resets it. A global,
      // not a static, so it can be read back when diagnosing a unit.
      if (stale) {
        id(ads_error_ticks)++;
      } else {
        id(ads_error_ticks) = 0;
      }
      return id(ads_error_ticks);

# Last successful read per channel (millis; uint32_t subtraction survives rollover).
globals:
  - id: ads_as1_last_ok
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ads_as2_last_ok
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ads_ntc_last_ok
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Consecutive stale ticks and the hour-scale duty cycle
  - id: ads_error_ticks
    type: int
    restore_value: no
    initial_value: '0'
  - id: ads_unhealthy
    type: float
    restore_value: no
    initial_value: '0.0f'

# ADS1115 error detection. LED handled by the arbiter in led.yaml
binary_sensor:
# Warning after 3min of continuous errors
  - platform: template
    id: ads_error_warning
    internal: true
    lambda: |-
      return id(ads_error_count).state >= 90;
    on_press:
      - logger.log:
          level: WARN
          tag: "samba"
          format: "ADS1115 unresponsive for 3min"
    on_release:
      - logger.log:
          level: INFO
          tag: "samba"
          format: "ADS1115 recovered"

# Error after 5min of continuous errors
  - platform: template
    id: ads_error_detected
    internal: true
    lambda: |-
      return id(ads_error_count).state >= 150;

# Restart as a last resort: 5min continuous, 35% of the hour stale, and 1h uptime
  - platform: template
    id: ads_restart_due
    internal: true
    lambda: |-
      return id(ads_error_count).state >= 150
          && id(ads_unhealthy) > 1250.0f
          && id(sys_uptime).state > 3600;
    on_press:
      - logger.log:
          level: ERROR
          format: "ADS1115 stale %.0f percent of last hour - restarting"
          args: ['id(ads_unhealthy) / 36.0f']
      - delay: 5s
      - button.press: sys_restart


# Retry ADS1115 setup after a boot-time bus collision.
#
# ADS1115Component::setup() reads the conversion register once; if that single transaction
# fails it calls mark_failed() and returns *before* prev_config_ is ever written. mark_failed
# is permanent for the boot, and prev_config_ stays 0 - so every later request_measurement()
# derives its config word from 0 and never sets the single-shot MODE bit, leaving the chip in
# continuous mode. There the OS bit reads 0 essentially always, so each poll spins the full
# 100ms and logs "Reading ADS1115 timed out" before returning NAN. One unlucky transaction at
# boot therefore costs globe temperature and air speed for the whole boot.
#
# That log line reads backwards: the spin loop only reaches it while the config register read
# keeps *succeeding*, because a real bus fault exits the loop silently. A flood of "Reading
# ADS1115 timed out" is therefore evidence the chip is answering, not that the bus is down.
#
# A collision at boot is not rare here: the K30 holds SCL low for ~40ms while it measures
# (TDE4700 section 3.7) and the ESP32 I2C timeout ceiling is 13ms, so any transaction
# overlapping that window fails.
#
# is_failed() is the whole guard - setup has long since run by the first tick, so this needs
# no millis() boot guard and no rollover latch.
interval:
  - interval: 30s
    then:
      - lambda: |-
          if (!id(ads_dac).is_failed())
            return;
          ESP_LOGW("samba", "ADS1115 failed setup - resetting component to retry");
          id(ads_dac).reset_to_construction_state();
          id(ads_dac).call();
