# SAMBA v2 FIRMWARE
# configure analog-to-digital converter on remote board
# https://esphome.io/components/sensor/ads1115.html
# written by Thomas Parkinson, May 2024


# Define component
ads1115:
  - address: 0x4B
    continuous_mode: off
    id: ads_dac

# Define raw measurements for sensors
sensor:
# Air speed sensor 1
  - platform: ads1115
    ads1115_id: ads_dac
    id: ads_as1
    multiplexer: 'A0_GND'
    gain: 6.144
    sample_rate: 64
    update_interval: 2s
    internal: true
    on_value:
      - lambda: 'id(ads_as1_last_ok) = millis();'

# Air speed sensor 2
  - platform: ads1115
    ads1115_id: ads_dac
    id: ads_as2
    multiplexer: 'A1_GND'
    gain: 6.144
    sample_rate: 64
    update_interval: 2s
    internal: true
    on_value:
      - lambda: 'id(ads_as2_last_ok) = millis();'

# NTC thermistor
  - platform: ads1115
    ads1115_id: ads_dac
    id: ads_ntc
    multiplexer: 'A2_GND'
    gain: 6.144
    sample_rate: 16
    update_interval: 30s
    internal: true
    on_value:
      - lambda: 'id(ads_ntc_last_ok) = millis();'

# ADS1115 error counter: 2s stale ticks. Not isnan() - a failed read is never published
  - platform: template
    id: ads_error_count
    internal: true
    update_interval: 2s
    accuracy_decimals: 0
    lambda: |-
      const uint32_t now = millis();
      const bool as1_stale = (now - id(ads_as1_last_ok)) > 6000;
      const bool as2_stale = (now - id(ads_as2_last_ok)) > 6000;
      const bool ntc_stale = (now - id(ads_ntc_last_ok)) > 90000;
      const bool stale = as1_stale || as2_stale || ntc_stale;

      // Seconds stale per hour, EWMA over ~59min, gating the restart only: errors here come
      // in waves and a reboot must not react to one. Steady state is 3571 * duty cycle, so
      // the 1250 threshold in ads_restart_due is a sustained 35%.
      id(ads_unhealthy) = (id(ads_unhealthy) + (stale ? 2.0f : 0.0f)) * 0.99944f;

      // Consecutive-failure ticks, driving the LED and the soft recovery. Any successful read
      // resets it. A global, not a static, so it can be read back when diagnosing a unit.
      if (stale) {
        id(ads_error_ticks)++;
      } else {
        id(ads_error_ticks) = 0;
      }
      return id(ads_error_ticks);

# Last successful read per channel (millis; uint32_t subtraction survives rollover).
globals:
  - id: ads_as1_last_ok
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ads_as2_last_ok
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ads_ntc_last_ok
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Consecutive stale ticks and the hour-scale duty cycle
  - id: ads_error_ticks
    type: int
    restore_value: no
    initial_value: '0'
  - id: ads_unhealthy
    type: float
    restore_value: no
    initial_value: '0.0f'

# Bus resets performed in the current error episode, cleared when the warning releases
  - id: ads_reset_attempts
    type: int
    restore_value: no
    initial_value: '0'

# ADS1115 error detection. LED handled by the arbiter in led.yaml
binary_sensor:
# Warning after 3min of continuous errors
  - platform: template
    id: ads_error_warning
    internal: true
    lambda: |-
      return id(ads_error_count).state >= 90;
    on_press:
      - logger.log:
          level: WARN
          tag: "samba"
          format: "ADS1115 unresponsive for 3min"
    on_release:
      - lambda: 'id(ads_reset_attempts) = 0;'
      - logger.log:
          level: INFO
          tag: "samba"
          format: "ADS1115 recovered"

# Error after 5min of continuous errors
  - platform: template
    id: ads_error_detected
    internal: true
    lambda: |-
      return id(ads_error_count).state >= 150;

# Restart as a last resort: 5min continuous, 35% of the hour stale, and 1h uptime
  - platform: template
    id: ads_restart_due
    internal: true
    lambda: |-
      return id(ads_error_count).state >= 150
          && id(ads_unhealthy) > 1250.0f
          && id(sys_uptime).state > 3600;
    on_press:
      - logger.log:
          level: ERROR
          format: "ADS1115 stale %.0f percent of last hour - restarting"
          args: ['id(ads_unhealthy) / 35.71f']
      - delay: 5s
      - button.press: sys_restart

# Soft recovery to unstick a wedged bus in place, three attempts per episode
interval:
  - interval: 10s
    then:
      - lambda: |-
          if (!id(ads_error_warning).state)
            return;

          // A reset that genuinely unwedges a bus works on the first attempt. The Aug 2026
          // soak fired 92 with no measurable effect, 56 of them into a single 27min episode
          // that then recovered on its own schedule. Kept because a wedged bus is real and
          // the reset is cheap, but capped: three attempts is a clean test of the premise,
          // where an unbounded retry every 30s only produces noise.
          if (id(ads_reset_attempts) >= 3)
            return;

          if (id(i2c_recovery_a).reset_bus()) {
            id(ads_reset_attempts)++;
            ESP_LOGW("adc", "ADS1115 unresponsive for %.0f x 2s - I2C bus reset %d of 3",
                     id(ads_error_count).state, id(ads_reset_attempts));
          } else {
            ESP_LOGD("adc", "ADS1115 still unresponsive - bus reset rate-limited or failed");
          }