# SAMBA v2 FIRMWARE
# configure analog-to-digital converter on remote board
# https://esphome.io/components/sensor/ads1115.html
# written by Thomas Parkinson, May 2024


# Define component
ads1115:
  - address: 0x4B
    continuous_mode: off
    id: ads_dac

# Define raw measurements for sensors
sensor:
# Air speed sensor 1
  - platform: ads1115
    ads1115_id: ads_dac
    id: ads_as1
    multiplexer: 'A0_GND'
    gain: 6.144
    sample_rate: 64
    update_interval: 2s
    internal: true

# Air speed sensor 2
  - platform: ads1115
    ads1115_id: ads_dac
    id: ads_as2
    multiplexer: 'A1_GND'
    gain: 6.144
    sample_rate: 64
    update_interval: 2s
    internal: true

# NTC thermistor
  - platform: ads1115
    ads1115_id: ads_dac
    id: ads_ntc
    multiplexer: 'A2_GND'
    gain: 6.144
    sample_rate: 16
    update_interval: 30s
    internal: true

# ADS1115 error counter
  - platform: template
    id: ads_error_count
    internal: true
    update_interval: 2s
    accuracy_decimals: 0
    lambda: |-
      static int count = 0;
      if (isnan(id(ads_as1).state) || isnan(id(ads_as2).state) || isnan(id(ads_ntc).state)) {
        count++;
      } else {
        count = 0;
      }
      return count;

# ADS1115 error detection
binary_sensor:
# Warning after 3min of continuous errors
  - platform: template
    id: ads_error_warning
    internal: true
    lambda: |-
      return id(ads_error_count).state >= 90;
    on_press:
      - light.turn_on:
          id: samba_led
          effect: none
          red: 80%
          green: 50%
          blue: 0%
          brightness: 50%
    on_release:
      - light.turn_off: samba_led

# Error LED after 5min of continuous errors
  - platform: template
    id: ads_error_detected
    internal: true
    lambda: |-
      return id(ads_error_count).state >= 150;
    on_press:
      - light.turn_on:
          id: samba_led
          effect: none
          red: 100%
          green: 0%
          blue: 0%
          brightness: 100%

# Restart as a last-resort recovery, at most hourly. A dead ADS1115 costs globe temperature
# and air speed; it must not stop the remaining sensors reporting, which is what an immediate
# restart did - rebooting every 5min, faster than the sample cycle, so the unit published
# nothing at all. Uptime resets on restart, so gating on it self-rate-limits with no persistent
# state. The condition lives in the lambda rather than the action because on_press fires only
# on the false->true edge: gating the action would skip the restart and never retry.
  - platform: template
    id: ads_restart_due
    internal: true
    lambda: |-
      return id(ads_error_count).state >= 150 && id(sys_uptime).state > 3600;
    on_press:
      - logger.log:
          level: ERROR
          format: "ADS1115 dead after 1h uptime - restarting to attempt recovery"
      - delay: 5s
      - button.press: sys_restart