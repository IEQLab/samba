# SAMBA v2 FIRMWARE
# configure analog-to-digital converter on remote board
# https://esphome.io/components/sensor/ads1115.html
# written by Thomas Parkinson, May 2024


# Define component
ads1115:
  - address: 0x4B
    continuous_mode: on
    id: ads_dac

# Define raw measurements for sensors
sensor:
# Air speed sensor 1
  - platform: ads1115
    ads1115_id: ads_dac
    id: ads_as1
    multiplexer: 'A0_GND'
    gain: 6.144
    sample_rate: 64
    update_interval: 2s
    internal: true

# Air speed sensor 2
  - platform: ads1115
    ads1115_id: ads_dac
    id: ads_as2
    multiplexer: 'A1_GND'
    gain: 6.144
    sample_rate: 64
    update_interval: 2s
    internal: true

# NTC thermistor
  - platform: ads1115
    ads1115_id: ads_dac
    id: ads_ntc
    multiplexer: 'A2_GND'
    gain: 6.144
    sample_rate: 16
    update_interval: 30s
    internal: true

# ADS1115 error counter
  - platform: template
    id: ads_error_count
    internal: true
    update_interval: 2s
    accuracy_decimals: 0
    lambda: |-
      static int count = 0;
      if (isnan(id(ads_as1).state) || isnan(id(ads_as2).state) || isnan(id(ads_ntc).state)) {
        count++;
      } else {
        count = 0;
      }
      return count;

# ADS1115 error detection
binary_sensor:
# Warning after 3min of continuous errors
  - platform: template
    id: ads_error_warning
    internal: true
    lambda: |-
      return id(ads_error_count).state >= 90;
    on_press:
      - light.turn_on:
          id: samba_led
          red: 100%
          green: 50%
          blue: 0%
          brightness: 70%
    on_release:
      - light.turn_off: samba_led

# Reboot after 5min of continuous errors
  - platform: template
    id: ads_error_detected
    internal: true
    lambda: |-
      return id(ads_error_count).state >= 150;
    on_press:
      - light.turn_on:
          id: samba_led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 100%
      - delay: 5s
      - button.press: sys_restart