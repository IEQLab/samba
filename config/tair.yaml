# SAMBA v2 FIRMWARE
# configure temperature and humidity sensor
# https://esphome.io/components/sensor/sht4x.html
# written by Thomas Parkinson, May 2024


# Define sensor
sensor:
  - platform: sht4x
    address: 0x44
    update_interval: 30s
    heater_max_duty: 0
    temperature:
      id: sht_temperature
      internal: true
      filters:
        - filter_out: nan
        - clamp:
            min_value: -10
            max_value: 60
            ignore_out_of_range: true
        - median:
            window_size: 10
            send_every: 1
            send_first_at: 1

    humidity:
      id: sht_humidity
      internal: true
      filters:
        - filter_out: nan
        - clamp:
            min_value: 0
            max_value: 100
            ignore_out_of_range: true
        - median:
            window_size: 10
            send_every: 1
            send_first_at: 1

# Define temperature measurements
  - platform: template
    id: samba_temperature
    name: "Air Temperature"
    update_interval: never
    accuracy_decimals: 1
    device_class: temperature
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    lambda: |-
      return id(calibration_ta_b)
           + (id(calibration_ta_m1) * id(sht_temperature).state)
           + (id(calibration_ta_m2) * (id(sht_temperature).state - id(pms_temp).state));

# Define humidity measurements
# RH is corrected by computing vapour pressure at the raw SHT temperature,
# then recalculating RH at the calibration-corrected temperature.
# This is more robust than a linear fit because the SHT40 measures RH
# relative to its own temperature element — correcting Ta corrects RH.
  - platform: template
    id: samba_humidity
    name: "Relative Humidity"
    update_interval: never
    accuracy_decimals: 0
    device_class: humidity
    unit_of_measurement: "%"
    icon: mdi:water-percent
    lambda: |-
      float t_raw       = id(sht_temperature).state;
      float rh_raw      = id(sht_humidity).state;
      float t_corrected = id(calibration_ta_b)
                        + id(calibration_ta_m1) * t_raw
                        + id(calibration_ta_m2) * (t_raw - id(pms_temp).state);
      float es_raw      = 6.1078f * expf(17.625f * t_raw       / (243.04f + t_raw));
      float es_cor      = 6.1078f * expf(17.625f * t_corrected / (243.04f + t_corrected));
      float rh_corrected = 100.0f * (rh_raw / 100.0f) * es_raw / es_cor;
      return std::max(0.0f, std::min(100.0f, rh_corrected));
