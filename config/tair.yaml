# SAMBA v2 FIRMWARE
# configure temperature and humidity sensor
# https://esphome.io/components/sensor/sht4x.html
# written by Thomas Parkinson, May 2024


# Define sensor
sensor:
  - platform: sht4x
    address: 0x44
    update_interval: 30s
    heater_max_duty: 0
    temperature:
      id: sht_temperature
      internal: true
      on_raw_value:
        # Timestamp every successful raw read. sht4x publishes both words only after a fully
        # successful transaction and publishes nothing at all on failure, so one stamp covers
        # the pair and .state would otherwise freeze at its last good value forever.
        - lambda: 'if (!std::isnan(x)) id(sht_last_ok) = millis();'
      filters:
        - filter_out: nan
        - clamp:
            min_value: -10
            max_value: 60
            ignore_out_of_range: true
        - median:
            window_size: 10
            send_every: 1
            send_first_at: 1

    humidity:
      id: sht_humidity
      internal: true
      filters:
        - filter_out: nan
        - clamp:
            min_value: 0
            max_value: 100
            ignore_out_of_range: true
        - median:
            window_size: 10
            send_every: 1
            send_first_at: 1

# Define temperature measurements
  - platform: template
    id: samba_temperature
    name: "Air Temperature"
    update_interval: never
    accuracy_decimals: 1
    device_class: temperature
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    lambda: |-
      // NaN so a dead sensor shows as unknown in HA, nan on the SD card, and is left out of
      // the upload. Only after a full sample interval of silence - the 30s poll and 10-wide
      // median carry temperature through ten consecutive failed reads.
      if (id(sht_last_ok) == 0 || (millis() - id(sht_last_ok)) > 330000)
        return NAN;
      return id(calibration_ta_b)
           + (id(calibration_ta_m1) * id(sht_temperature).state);

# Define humidity measurements
# RH is corrected by computing vapour pressure at the raw SHT temperature,
# then recalculating RH at the calibration-corrected temperature.
  - platform: template
    id: samba_humidity
    name: "Relative Humidity"
    update_interval: never
    accuracy_decimals: 0
    device_class: humidity
    unit_of_measurement: "%"
    icon: mdi:water-percent
    lambda: |-
      if (id(sht_last_ok) == 0 || (millis() - id(sht_last_ok)) > 330000)
        return NAN;
      float t_raw       = id(sht_temperature).state;
      float rh_raw      = id(sht_humidity).state;
      // Must precede the clamp below. Every comparison against NaN is false, so
      // std::min(100.0f, NAN) returns 100.0f and a sensor that never read would report a
      // confident 100% RH instead of dropping out.
      if (std::isnan(t_raw) || std::isnan(rh_raw))
        return NAN;
      float t_corrected = id(calibration_ta_b)
                        + id(calibration_ta_m1) * t_raw;
      float es_raw      = 6.1078f * expf(17.625f * t_raw       / (243.04f + t_raw));
      float es_cor      = 6.1078f * expf(17.625f * t_corrected / (243.04f + t_corrected));
      float rh_corrected = 100.0f * (rh_raw / 100.0f) * es_raw / es_cor;
      // Safe now: both operands are known finite.
      return std::max(0.0f, std::min(100.0f, rh_corrected));


# millis() of the last successful raw read
globals:
  - id: sht_last_ok
    type: uint32_t
    restore_value: no
    initial_value: '0'
