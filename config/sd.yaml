# SAMBA v2 FIRMWARE
# configure SD card
# written by Thomas Parkinson, Oct 2025


# define SD card
sd_spi_card:
  id: sd0
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19
  cs_pin: GPIO5
  auto_mount: true
  # A card absent at boot mounts later, long after on_time_sync has gone
  on_mount:
    then:
      - if:
          condition:
            and:
              - lambda: 'return !id(sd_logfile);'
              - lambda: 'return id(ds1307_time).now().is_valid();'
          then:
            - script.execute: sd_create
  
# Script to create file after initial time sync
script:
  - id: sd_create
    mode: single
    then:
      - lambda: |-
          // Get MAC address (without colons for filename)
          std::string mac = get_mac_address_pretty();
          mac.erase(std::remove(mac.begin(), mac.end(), ':'), mac.end());
          
          // Get boot timestamp
          auto t = id(ds1307_time).utcnow();
          char timestamp[32];
          t.strftime(timestamp, sizeof(timestamp), "%y%m%d_%H%M");
          
          // Create filename
          id(sd_filename) = "/" + mac + "_" + std::string(timestamp) + ".txt";
      - sd_spi_card.create_file:
          id: sd0
          path: !lambda 'return id(sd_filename);'
          content: !lambda |- 
            char header[256];
            snprintf(header, sizeof(header),
                     "# version: %s\n# building: %s\n# level: %s\n# zone: %s\ntime,ta,tg,rh,as,mrt,co2,lux,pm25,tvoc,nox,laeq,la90,la10\n",
                     ESPHOME_PROJECT_VERSION,
                     id(building_tag).c_str(),
                     id(level_tag).c_str(),
                     id(zone_tag).c_str());
            return std::string(header);
      # Only latch on a file that actually exists; create_file is idempotent
      - lambda: 'id(sd_logfile) = id(sd0).file_exists(id(sd_filename));'


# Wipe the card over the native API (`samba deploy` gate, after it has copied the logs off)
# The erase runs on a background task; on_mount then starts a fresh log with the current tags
api:
  actions:
    - action: sd_erase
      then:
        - lambda: 'id(sd_logfile) = false;'
        - sd_spi_card.erase:
            id: sd0
        # "erasing" (or "failed") at once, so a client never reads a previous erase's result
        - component.update: sd_erase_state

text_sensor:
  - platform: template
    name: "SD Card Erase"
    id: sd_erase_state
    icon: mdi:sd
    entity_category: "diagnostic"
    update_interval: 5s
    lambda: |-
      switch (id(sd0).erase_state()) {
        case sd_spi_card::EraseState::ERASING: return std::string("erasing");
        case sd_spi_card::EraseState::ERASED: return std::string("erased");
        case sd_spi_card::EraseState::FORMATTED: return std::string("formatted");
        case sd_spi_card::EraseState::FAILED: return std::string("failed");
        default: return std::string("idle");
      }


# Store filename as global variable
globals:
  - id: sd_filename
    type: std::string
    initial_value: '"/samba.txt"'

# Store whether it's been created as a global variable
  - id: sd_logfile
    type: bool
    restore_value: no
    initial_value: 'false'

# Toggle SD write
switch:
  - platform: template
    name: "SD Card Write"
    id: switch_sdcard
    icon: mdi:sd
    entity_category: "config"
    restore_mode: DISABLED
    lambda: |-
      return id(sd_enable);
    turn_on_action:
      - lambda: 'id(sd_enable) = true;'
    turn_off_action:
      - lambda: 'id(sd_enable) = false;'

# Manually mount SD card
button:
  - platform: template
    name: "SD Card Mount"
    id: button_sdcard
    icon: mdi:sd
    entity_category: "config"
    on_press:
      then:
        - sd_spi_card.mount:
            id: sd0
      