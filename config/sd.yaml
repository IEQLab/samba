# SAMBA v2 FIRMWARE
# configure SD card
# written by Thomas Parkinson, Oct 2025


# define SD card
sd_spi_card:
  id: sd0
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19
  cs_pin: GPIO5
  auto_mount: true
  
# Script to create file after initial time sync
script:
  - id: sd_create
    mode: single
    then:
      - lambda: |-
          // Get MAC address (without colons for filename)
          std::string mac = get_mac_address_pretty();
          mac.erase(std::remove(mac.begin(), mac.end(), ':'), mac.end());
          
          // Get boot timestamp
          auto t = id(ds1307_time).utcnow();
          char timestamp[32];
          t.strftime(timestamp, sizeof(timestamp), "%y%m%d_%H%M");
          
          // Create filename
          id(sd_filename) = "/" + mac + "_" + std::string(timestamp) + ".txt";
      - sd_spi_card.create_file:
          id: sd0
          path: !lambda 'return id(sd_filename);'
          content: !lambda |- 
            char header[256];
            snprintf(header, sizeof(header),
                     "# version: %s\n# building: %s\n# level: %s\n# zone: %s\ntime,ta,tg,rh,as,mrt,co2,lux,pm25,tvoc,nox,laeq,la90,la10,la05\n",
                     ESPHOME_VERSION,
                     id(building_tag).c_str(),
                     id(level_tag).c_str(),
                     id(zone_tag).c_str());
            return std::string(header);
      - lambda: 'id(sd_logfile) = true;'


# Store filename as global variable
globals:
  - id: sd_filename
    type: std::string
    initial_value: '"/samba.txt"'

# Store whether it's been created as a global variable
  - id: sd_logfile
    type: bool
    restore_value: no
    initial_value: 'false'

# Toggle SD write
switch:
  - platform: template
    name: "SD Card Write"
    id: switch_sdcard
    icon: mdi:sd
    entity_category: "config"
    restore_mode: DISABLED
    lambda: |-
      return id(sd_enable);
    turn_on_action:
      - lambda: 'id(sd_enable) = true;'
    turn_off_action:
      - lambda: 'id(sd_enable) = false;'

# Manually mount SD card
button:
  - platform: template
    name: "SD Card Mount"
    id: button_sdcard
    icon: mdi:sd
    entity_category: "config"
    on_press:
      then:
        - sd_spi_card.mount:
            id: sd0
      