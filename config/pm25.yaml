# SAMBA v2 FIRMWARE
# configure particulate matter sensor
# https://esphome.io/components/sensor/pmsx003.html
# written by Thomas Parkinson, May 2024


# Define sensor
sensor:
  - platform: pmsx003
    type: PMS5003T
    uart_id: uart_pm
    pm_2_5:
      id: pms_pm25
      internal: true
      on_raw_value:
        # Timestamp every successful raw read. pmsx003 publishes only on a good frame and
        # nothing at all on a timeout, so without this .state freezes at its last good value.
        - lambda: 'if (!std::isnan(x)) id(pms_last_ok) = millis();'
      filters:
        - filter_out: nan
        - clamp:
            min_value: 0
            max_value: 1000
            ignore_out_of_range: true
        - median:
            window_size: 300
            send_every: 30
            send_first_at: 10
    temperature:
      id: pms_temp
      internal: true
    humidity:
      id: pms_rh
      internal: true
      filters:
        - clamp:
            min_value: 0
            max_value: 100
            ignore_out_of_range: true
        - median:
            window_size: 300

# Define PM2.5 measurements
  - platform: template
    id: samba_pm25
    name: "PM2.5"
    update_interval: never
    accuracy_decimals: 0
    device_class: pm25
    unit_of_measurement: "µg/m3"
    icon: mdi:molecule
    lambda: |-
      // NaN so a dead sensor shows as unknown in HA, nan on the SD card, and is left out of
      // the upload. The PMS5003 streams a frame roughly every second, so this needs a full
      // sample interval of silence.
      if (id(pms_last_ok) == 0 || (millis() - id(pms_last_ok)) > 330000)
        return NAN;

      float pm = id(pms_pm25).state;
      float rh = id(pms_rh).state;
      if (isnan(pm) || isnan(rh)) return NAN;

      float corrected;

      if (pm < 30.0) {
        corrected = (0.524 * pm - 0.0862 * rh + 5.75);
      }

      else if (pm < 50.0) {
        float alpha = pm / 20.0 - 1.5;
        corrected = (0.786 * alpha + 0.524 * (1.0 - alpha)) * pm - 0.0862 * rh + 5.75;
      }

      else if (pm < 210.0) {
        corrected = (0.786 * pm - 0.0862 * rh + 5.75);
      }

      else if (pm < 260.0) {
        float alpha = pm / 50.0 - 4.2;
        corrected = (0.69 * alpha + 0.786 * (1.0 - alpha)) * pm
               - 0.0862 * rh * (1.0 - alpha)
               + 2.966 * alpha
               + 5.75 * (1.0 - alpha)
               + 8.84e-4 * pm * pm * alpha;
      }

      else {
        corrected = 2.966 + 0.69 * pm + 8.84e-4 * pm * pm;
      }

      // The RH term drives the model negative at low PM and high RH: -2.9 at pm=0, rh=100.
      // A clamp filter cannot do this - it maps NaN to min_value and would undo the dropout
      // above - but std::max is safe here because every path to this point is finite.
      return std::max(0.0f, corrected);


# millis() of the last successful raw read
globals:
  - id: pms_last_ok
    type: uint32_t
    restore_value: no
    initial_value: '0'
