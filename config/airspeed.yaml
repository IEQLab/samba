# SAMBA v2 FIRMWARE
# configure anemometers for air speed measurements
# written by Thomas Parkinson, May 2024


# Define voltage measurements
sensor:
  - platform: copy
    id: as_1
    source_id: ads_as1
    internal: true
    filters:
      - filter_out: nan
      - clamp:
          min_value: 0
          max_value: 5
          ignore_out_of_range: true
      - median:
          window_size: 30
          send_every: 10
          send_first_at: 10
      - lambda: |-
            // v = exp(K + C1*V + G*(Ta - 22)); C1, G are fleet constants (substitutions)
            // Nominal 22 degC so a dead SHT4x does not take air speed with it
            float ta = id(samba_temperature).state;
            if (std::isnan(ta))
              ta = 22.0f;
            const float k = id(calibration_as1_k);
            if (std::isnan(k))
              return NAN;
            // x <= 5 V keeps the exponent under ~9; bound here, as a clamp filter turns NaN into 0.02
            const float v = expf(k + ${airspeed_c1}f * x + ${airspeed_g}f * (ta - 22.0f));
            return std::min(std::max(v, 0.02f), 1.0f);

  - platform: copy
    id: as_2
    source_id: ads_as2
    internal: true
    filters:
      - filter_out: nan
      - clamp:
          min_value: 0
          max_value: 5
          ignore_out_of_range: true
      - median:
          window_size: 30
          send_every: 10
          send_first_at: 10
      - lambda: |-
            // v = exp(K + C1*V + G*(Ta - 22)); C1, G are fleet constants (substitutions)
            // Nominal 22 degC so a dead SHT4x does not take air speed with it
            float ta = id(samba_temperature).state;
            if (std::isnan(ta))
              ta = 22.0f;
            const float k = id(calibration_as2_k);
            if (std::isnan(k))
              return NAN;
            // x <= 5 V keeps the exponent under ~9; bound here, as a clamp filter turns NaN into 0.02
            const float v = expf(k + ${airspeed_c1}f * x + ${airspeed_g}f * (ta - 22.0f));
            return std::min(std::max(v, 0.02f), 1.0f);

# Define air speed measurements
  - platform: template
    id: samba_airspeed
    name: "Air Speed"
    update_interval: never
    accuracy_decimals: 2
    device_class: wind_speed
    unit_of_measurement: "m/s"
    icon: mdi:weather-windy
    lambda: |-
      // Drop out per channel, so one dead anemometer leaves the other reporting
      const uint32_t now = millis();
      const bool as1_stale = id(ads_as1_last_ok) == 0 || (now - id(ads_as1_last_ok)) > 330000;
      const bool as2_stale = id(ads_as2_last_ok) == 0 || (now - id(ads_as2_last_ok)) > 330000;
      if (as1_stale && as2_stale)
        return NAN;
      if (as1_stale)
        return id(as_2).state;
      if (as2_stale)
        return id(as_1).state;
      // std::max returns whichever argument NaN lands in, so choose explicitly
      const float as1 = id(as_1).state;
      const float as2 = id(as_2).state;
      if (std::isnan(as1))
        return as2;
      if (std::isnan(as2))
        return as1;
      return std::max(as1, as2);
