# SAMBA v2 FIRMWARE
# configure anemometers for air speed measurements
# written by Thomas Parkinson, May 2024


# Define voltage measurements
sensor:
  - platform: copy
    id: as_1
    source_id: ads_as1
    internal: true
    filters:
      - filter_out: nan
      - clamp:
          min_value: 0
          max_value: 5
          ignore_out_of_range: true
      - median:
          window_size: 150
          send_every: 60
          send_first_at: 60
      - lambda: |-
            float temp = id(samba_temperature).state;
            float floor = id(calibration_as1_d0) + id(calibration_as1_d1) * temp;
            float v_above_floor = std::max(x - floor, 0.001f);
            return id(calibration_as1_a) * pow(v_above_floor, id(calibration_as1_b))
                    + id(calibration_as1_c) * x * temp;
      - clamp:
          min_value: 0.02
          max_value: 1.0
          ignore_out_of_range: false

  - platform: copy
    id: as_2
    source_id: ads_as2
    internal: true
    filters:
      - filter_out: nan
      - clamp:
          min_value: 0
          max_value: 5
          ignore_out_of_range: true
      - median:
          window_size: 150
          send_every: 60
          send_first_at: 60
      - lambda: |-
            float temp = id(samba_temperature).state;
            float floor = id(calibration_as2_d0) + id(calibration_as2_d1) * temp;
            float v_above_floor = std::max(x - floor, 0.001f);
            return id(calibration_as2_a) * pow(v_above_floor, id(calibration_as2_b))
                    + id(calibration_as2_c) * x * temp;
      - clamp:
          min_value: 0.02
          max_value: 1.0
          ignore_out_of_range: false

# Define air speed measurements
  - platform: template
    id: samba_airspeed
    name: "Air Speed"
    update_interval: never
    accuracy_decimals: 2
    device_class: wind_speed
    unit_of_measurement: "m/s"
    icon: mdi:weather-windy
    lambda: |-
      return max(id(as_1).state, id(as_2).state);
