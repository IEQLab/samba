# SAMBA v2 FIRMWARE
# configure SAMBA to use Home Assistant API
# https://esphome.io/components/api.html
# written by Thomas Parkinson, May 2024


# Enable Home Assistant API
api:
  reboot_timeout: 0s
  # Noise encryption with the key provisioned at runtime, so the binary carries no key
  # One key per building, set by `samba deploy` before it sends anything else
  encryption: {}
