# SAMBA v2 FIRMWARE
# configure K30 carbon dioxide sensor on SAMBA
# custom component for K30 sensor
# written by Thomas Parkinson, May 2024


# Define sensor
sensor:
  - platform: senseair_i2c
    id: k30_co2
    i2c_id: bus_a
    address: 0x69
    internal: true
    update_interval: 30s
    abc_interval: 180h
    read_delay_ms: 80
    retry_delay_ms: 160
    max_retries: 10
    filters:
      - filter_out: nan
      - clamp:
          min_value: 395
          max_value: 10000
          ignore_out_of_range: false
      - median:
          window_size: 6
          send_every: 2
          send_first_at: 1
    on_raw_value:
      # Timestamp every successful raw read
      - lambda: 'if (!std::isnan(x)) id(k30_last_ok) = millis();'

# Define CO2 measurements
  - platform: template
    id: samba_co2
    name: "Carbon Dioxide"
    update_interval: never
    accuracy_decimals: 0
    device_class: carbon_dioxide
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co2
    filters:
      - lambda: |-
          // NaN so a dead sensor shows as unknown in HA, nan on the SD card, and is left out
          // of the upload. Only after a full sample interval of silence - the 6-wide median
          // carries CO2 through a single failed poll.
          if (id(k30_last_ok) == 0 || (millis() - id(k30_last_ok)) > 330000)
            return NAN;
          return ((id(calibration_co2_m) * id(k30_co2).state) + id(calibration_co2_b));


# Error counter for initialisation failure recovery
globals:
# millis() of the last successful raw read
  - id: k30_last_ok
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: k30_error_count
    type: int
    restore_value: no
    initial_value: '0'
# Hour-scale failure duty cycle, restart gate only. Not restored: a restart is itself the
# recovery attempt, so its own justification must not carry over.
  - id: k30_unhealthy
    type: float
    restore_value: no
    initial_value: '0.0f'

# Re-initialise on first failure; restart only on a sustained fault, at most hourly
interval:
  - interval: 30s
    then:
      - lambda: |-
          // Check if CO2 sensor is returning valid data. The raw value is NaN after a failed
          // read; the filtered .state never is, because filter_out drops the NaN.
          const bool failed = std::isnan(id(k30_co2).get_raw_state());

          // Seconds failed per hour, EWMA over ~1h at this 30s poll: steady state is
          // 3600 * duty cycle, so k30_unhealthy reads directly as seconds of the last hour.
          id(k30_unhealthy) = (id(k30_unhealthy) + (failed ? 30.0f : 0.0f)) * 0.99167f;

          if (failed) {
            id(k30_error_count)++;
            // Re-initialise on the first failure, then every 10th (5min) while it stays down.
            // One attempt used to be all it got, which with an hourly restart could mean an
            // hour of no CO2 and no further recovery attempted.
            if (id(k30_error_count) == 1 || id(k30_error_count) % 10 == 0) {
              ESP_LOGW("samba", "K30 CO2 sensor failure %d - attempting re-initialisation",
                       id(k30_error_count));
              id(k30_co2).reinitialize();
            } else {
              ESP_LOGW("samba", "K30 CO2 sensor failure %d", id(k30_error_count));
            }

            // LED handled by the arbiter in led.yaml.

            // Restart only on a sustained fault. A 12h soak measured a flaky board failing 31%
            // of polls, and its restarts did nothing: 0.641 -> 0.644 failures/min across the 9
            // boots either side. 2400 is 67% of the hour, so only a near-dead K30 restarts. NaN
            // propagates upstream, so until then a dead K30 costs only CO2.
            if (id(k30_error_count) >= 4 && id(k30_unhealthy) > 2400.0f
                && id(sys_uptime).state > 3600) {
              ESP_LOGE("samba", "K30 failed %.0f percent of the last hour - restarting to attempt recovery",
                       id(k30_unhealthy) / 36.0f);
              id(sys_restart).press();
            }

          } else {
            if (id(k30_error_count) > 0) {
              ESP_LOGI("samba", "K30 CO2 sensor recovered after re-initialisation");
            }
            id(k30_error_count) = 0;
          }

# Manually trigger ABC
button:
  - platform: template
    name: "CO2 ABC Calibration"
    id: co2_abc_calibration
    entity_category: "config"
    icon: mdi:molecule-co2
    on_press:
      - senseair_i2c.background_calibration:
          id: k30_co2
