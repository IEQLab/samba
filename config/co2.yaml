# SAMBA v2 FIRMWARE
# configure K30 carbon dioxide sensor on SAMBA
# custom component for K30 sensor
# written by Thomas Parkinson, May 2024


# Define sensor
sensor:
  - platform: senseair_i2c
    id: k30_co2
    i2c_id: bus_a
    address: 0x69
    internal: true
    update_interval: 30s
    abc_interval: 180h
    read_delay_ms: 80
    retry_delay_ms: 160
    max_retries: 10
    filters:
      - filter_out: nan
      - clamp:
          min_value: 395
          max_value: 10000
          ignore_out_of_range: false
      - median:
          window_size: 6
          send_every: 2
          send_first_at: 1
    on_raw_value:
      # Timestamp every successful raw read. The filtered .state already survives a single
      # failure, so the published value only becomes meaningless once the sensor has been
      # silent for a whole sample interval.
      - lambda: 'if (!std::isnan(x)) id(k30_last_ok) = millis();'

# Define CO2 measurements
  - platform: template
    id: samba_co2
    name: "Carbon Dioxide"
    update_interval: never
    accuracy_decimals: 0
    device_class: carbon_dioxide
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co2
    filters:
      - lambda: |-
          // A failed K30 read publishes NaN, which k30_co2's own filters drop, so its filtered
          // .state keeps the last good value. Check the raw value so a dead sensor yields NaN
          // here: Home Assistant shows unknown, the SD row records nan, and the InfluxDB
          // upload leaves the field out (and warns) instead of repeating a stale reading.
          // Report NaN only once the K30 has produced no good read for a whole 5min sample
          // interval. get_raw_state() is the single most recent read, so testing it discarded
          // the entire cycle whenever one poll of the ten in a window happened to fail - CO2
          // moves slowly and the 6-wide median exists precisely for that redundancy.
          if (id(k30_last_ok) == 0 || (millis() - id(k30_last_ok)) > 330000)
            return NAN;
          return ((id(calibration_co2_m) * id(k30_co2).state) + id(calibration_co2_b));


# Error counter for initialisation failure recovery
globals:
# millis() of the last successful raw read; uint32_t subtraction wraps correctly.
  - id: k30_last_ok
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: k30_error_count
    type: int
    restore_value: no
    initial_value: '0'

# Re-initialise on first failure, restart after 4 failures (~2 mins)
interval:
  - interval: 30s
    then:
      - lambda: |-
          // Check if CO2 sensor is returning valid data. The raw value is NaN after a failed
          // read; the filtered .state never is, because filter_out drops the NaN.
          if (std::isnan(id(k30_co2).get_raw_state())) {
            id(k30_error_count)++;
            if (id(k30_error_count) == 1) {

              // Try re-initialisation on first failure
              ESP_LOGW("samba", "K30 CO2 sensor failure - attempting re-initialisation");
              id(k30_co2).reinitialize();

            } else {
              ESP_LOGW("samba", "K30 CO2 sensor failure %d/4", id(k30_error_count));
            }

            // Warning LED at 3 failures (cyan)
            if (id(k30_error_count) == 3) {
              auto call = id(samba_led).turn_on();
              call.set_effect("none");
              call.set_rgb(0.0, 0.8, 0.8);
              call.set_brightness(0.5);
              call.perform();
            }

            // Error LED at 4 failures (blue) then restart
            if (id(k30_error_count) >= 4) {
              auto call = id(samba_led).turn_on();
              call.set_effect("none");
              call.set_rgb(0.0, 0.0, 1.0);
              call.set_brightness(1.0);
              call.perform();

              // A dead K30 must not stop the other twelve sensors reporting: the raw read
              // publishes NaN, so CO2 is simply absent upstream. Restart only as a last-resort
              // recovery attempt, and at most hourly - uptime resets on restart, so this
              // self-rate-limits without any persistent state.
              if (id(sys_uptime).state > 3600) {
                ESP_LOGE("samba", "K30 re-initialisation failed after 1h uptime - restarting to attempt recovery");
                id(sys_restart).press();
              }
            }

          } else {
            if (id(k30_error_count) > 0) {
              ESP_LOGI("samba", "K30 CO2 sensor recovered after re-initialisation");
              id(samba_led).turn_off();
            }
            id(k30_error_count) = 0;
          }

# Manually trigger ABC
button:
  - platform: template
    name: "CO2 ABC Calibration"
    id: co2_abc_calibration
    entity_category: "config"
    icon: mdi:molecule-co2
    on_press:
      - senseair_i2c.background_calibration:
          id: k30_co2
