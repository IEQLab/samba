# SAMBA v2 FIRMWARE
# configure K30 carbon dioxide sensor on SAMBA
# custom component for K30 sensor
# written by Thomas Parkinson, May 2024


# Define sensor
sensor:
  - platform: senseair_i2c
    id: k30_co2
    i2c_id: bus_a
    address: 0x69
    internal: true
    update_interval: 30s
    abc_interval: 180h
    read_delay_ms: 40
    retry_delay_ms: 160
    max_retries: 5
    filters:
      - filter_out: nan
      - clamp:
          min_value: 395
          max_value: 10000
          ignore_out_of_range: false
      - median:
          window_size: 6
          send_every: 2
          send_first_at: 1

# Define CO2 measurements
  - platform: template
    id: samba_co2
    name: "Carbon Dioxide"
    update_interval: never
    accuracy_decimals: 0
    device_class: carbon_dioxide
    unit_of_measurement: "ppm"
    icon: mdi:molecule-co2
    filters:
      - lambda: |-
          return ((id(calibration_co2_m) * id(k30_co2).state) + id(calibration_co2_b));


# Error counter for initialisation failure recovery
globals:
  - id: k30_error_count
    type: int
    restore_value: no
    initial_value: '0'

# Re-initialise on first failure, restart after 4 failures (~2 mins)
interval:
  - interval: 30s
    then:
      - lambda: |-
          // Check if CO2 sensor is returning valid data
          if (std::isnan(id(k30_co2).state)) {
            id(k30_error_count)++;
            if (id(k30_error_count) == 1) {

              // Try re-initialisation on first failure
              ESP_LOGW("samba", "K30 CO2 sensor failure - attempting re-initialisation");
              id(k30_co2).reinitialize();

            } else {
              ESP_LOGW("samba", "K30 CO2 sensor failure %d/4", id(k30_error_count));
            }

            // Warning LED at 3 failures (cyan)
            if (id(k30_error_count) == 3) {
              auto call = id(samba_led).turn_on();
              call.set_effect("none");
              call.set_rgb(0.0, 0.8, 0.8);
              call.set_brightness(0.5);
              call.perform();
            }

            // Error LED at 4 failures (blue) then restart
            if (id(k30_error_count) >= 4) {
              auto call = id(samba_led).turn_on();
              call.set_effect("none");
              call.set_rgb(0.0, 0.0, 1.0);
              call.set_brightness(1.0);
              call.perform();

              ESP_LOGE("samba", "K30 re-initialisation failed - restarting device");
              id(sys_restart).press();
            }

          } else {
            if (id(k30_error_count) > 0) {
              ESP_LOGI("samba", "K30 CO2 sensor recovered after re-initialisation");
              id(samba_led).turn_off();
            }
            id(k30_error_count) = 0;
          }

# Manually trigger ABC
button:
  - platform: template
    name: "CO2 ABC Calibration"
    id: co2_abc_calibration
    entity_category: "config"
    icon: mdi:molecule-co2
    on_press:
      - senseair_i2c.background_calibration:
          id: k30_co2
