# SAMBA v2 FIRMWARE
# configure upload of data to remote InfluxDB server
# custom component
# written by Thomas Parkinson, May 2024


# Define InfluxDB connection
influxdb:
  id: influx
  http_request_id: http_client
  time_id: sntp_time
  host: "${influx_host}"
  port: "${influx_port}"
  # Empty: the fleet's token is provisioned at runtime. A build for another InfluxDB can put
  # a token here instead; a provisioned one still takes precedence
  token: ""
  bucket: "${influx_bucket}"
  org: "${influx_org}"
  use_ssl: true
  send_mac: true
  timestamp_unit: "s"
  update_interval: never
  status_text_sensor: influx_status

  # Sensors to upload, keyed by ESPHome id and grouped by measurement
  sensors:
    - {id: samba_temperature, measurement: ieq, field: air_temp}
    - {id: samba_humidity,    measurement: ieq, field: rel_humidity}
    - {id: samba_globe,       measurement: ieq, field: globe_temp}
    - {id: samba_mrt,         measurement: ieq, field: rad_temp}
    - {id: samba_airspeed,    measurement: ieq, field: air_speed}
    - {id: samba_co2,         measurement: ieq, field: co2}
    - {id: samba_pm25,        measurement: ieq, field: pm25}
    - {id: samba_tvoc,        measurement: ieq, field: tvoc}
    - {id: samba_nox,         measurement: ieq, field: nox}
    - {id: samba_lux,         measurement: ieq, field: illuminance}
    - {id: samba_laeq,        measurement: ieq, field: la_eq}
    - {id: samba_la90,        measurement: ieq, field: la_90}
    - {id: samba_la10,        measurement: ieq, field: la_10}
    - {id: sys_wifiperc,      measurement: device_status, field: wifi}
    - {id: sys_uptime,        measurement: device_status, field: uptime}

  # Define global tags applied to all measurements
  global_tags:
    building: !lambda "return id(building_tag);"
    level: !lambda "return id(level_tag);"
    zone: !lambda "return id(zone_tag);"


# Toggle Influx uploads
switch:
  - platform: template
    name: "InfluxDB Upload"
    id: switch_influx
    icon: mdi:cloud-upload-outline
    entity_category: "config"
    restore_mode: DISABLED
    lambda: |-
      return id(influx_enable);
    turn_on_action:
      - lambda: 'id(influx_enable) = true;'
    turn_off_action:
      - lambda: 'id(influx_enable) = false;'


# Provision the InfluxDB token over the native API (`samba deploy`), one per building
# Lives in the influx_token global and takes precedence over any compiled-in token
esphome:
  on_boot:
    # after the globals are restored (HARDWARE), before the influxdb component sets up
    - priority: 600
      then:
        - lambda: 'id(influx).set_token_override(id(influx_token));'

api:
  actions:
    - action: influx_set_token
      variables:
        token: string
      then:
        - lambda: |-
            // Tokens are 88 printable ASCII characters; an empty token clears it, falling back to the compiled-in one
            if (token.size() > 88) {
              ESP_LOGW("samba", "Rejected InfluxDB token: %u characters", (unsigned) token.size());
              return;
            }
            for (char c : token) {
              if (c <= ' ' || c > '~') {
                ESP_LOGW("samba", "Rejected InfluxDB token: not printable ASCII");
                return;
              }
            }
            id(influx_token) = token;
            id(influx).set_token_override(token);
            id(influx_token_fp).update();
            ESP_LOGI("samba", "InfluxDB token %s (fingerprint %s)",
                     token.empty() ? "cleared" : "set", id(influx_token_fp).get_state().c_str());
        - script.execute: influx_token_save

text_sensor:
  # Fingerprint of the provisioned token, or "unset" when none
  - platform: template
    name: "InfluxDB Token"
    id: influx_token_fp
    icon: mdi:key-outline
    entity_category: "diagnostic"
    update_interval: 60s
    lambda: |-
      if (id(influx_token).empty())
        return std::string("unset");
      char buf[9];
      snprintf(buf, sizeof(buf), "%08x", (unsigned) esphome::fnv1_hash(id(influx_token)));
      return std::string(buf);

  # Outcome of the last upload attempt, published by the influxdb component
  - platform: template
    name: "InfluxDB Status"
    id: influx_status
    icon: mdi:cloud-check-outline
    entity_category: "diagnostic"
    update_interval: never

script:
  # Flush the token to flash, then prove it with a real write
  - id: influx_token_save
    mode: restart
    then:
      - delay: 2s
      - lambda: |-
          if (!global_preferences->sync()) {
            ESP_LOGE("samba", "Failed to save InfluxDB token to flash; it will revert on power cycle");
            return;
          }
          ESP_LOGI("samba", "InfluxDB token saved to flash");
      - if:
          condition:
            switch.is_on: switch_influx
          then:
            - component.update: sys_uptime
            - influxdb.publish:
                id: influx
                sensor_ids: [sys_uptime]
