# SAMBA v2 FIRMWARE
# configure upload of data to remote InfluxDB server
# custom component
# written by Thomas Parkinson, May 2024


# Define InfluxDB connection
influxdb:
  id: influx
  http_request_id: http_client
  time_id: sntp_time
  host: "${influx_host}"
  port: "${influx_port}"
  token: "${influx_token}"
  bucket: "${influx_bucket}"
  org: "${influx_org}"
  use_ssl: true
  send_mac: true
  timestamp_unit: "s"
  update_interval: never

  # Sensors to upload, keyed by ESPHome id and grouped into measurements by `measurement`.
  # A sensor is only included when it has produced a value since the previous upload, so a
  # sensor that has stopped reporting drops out of the payload instead of repeating its last value.
  sensors:
    - {id: samba_temperature, measurement: ieq, field: air_temp}
    - {id: samba_humidity,    measurement: ieq, field: rel_humidity}
    - {id: samba_globe,       measurement: ieq, field: globe_temp}
    - {id: samba_mrt,         measurement: ieq, field: rad_temp}
    - {id: samba_airspeed,    measurement: ieq, field: air_speed}
    - {id: samba_co2,         measurement: ieq, field: co2}
    - {id: samba_pm25,        measurement: ieq, field: pm25}
    - {id: samba_tvoc,        measurement: ieq, field: tvoc}
    - {id: samba_nox,         measurement: ieq, field: nox}
    - {id: samba_lux,         measurement: ieq, field: illuminance}
    - {id: samba_laeq,        measurement: ieq, field: la_eq}
    - {id: samba_la90,        measurement: ieq, field: la_90}
    - {id: samba_la10,        measurement: ieq, field: la_10}
    - {id: sys_wifiperc,      measurement: device_status, field: wifi}
    - {id: sys_uptime,        measurement: device_status, field: uptime}

  # Define global tags applied to all measurements
  global_tags:
    building: !lambda "return id(building_tag);"
    level: !lambda "return id(level_tag);"
    zone: !lambda "return id(zone_tag);"


# Toggle Influx uploads
switch:
  - platform: template
    name: "InfluxDB Upload"
    id: switch_influx
    icon: mdi:cloud-upload-outline
    entity_category: "config"
    restore_mode: DISABLED
    lambda: |-
      return id(influx_enable);
    turn_on_action:
      - lambda: 'id(influx_enable) = true;'
    turn_off_action:
      - lambda: 'id(influx_enable) = false;'
