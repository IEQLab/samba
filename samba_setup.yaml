## INPUTS: SETTINGS ##

# Define setting toggles
switch:
  - platform: template
    name: "InfluxDB uploads"
    id: switch_influx
    web_server:
      sorting_group_id: sort_device_settings
    restore_mode: DISABLED
    icon: mdi:cloud-upload-outline
    lambda: |-
      return id(influx_enable);
    turn_on_action:
      - lambda: |-
          id(influx_enable) = true;
    turn_off_action:
      - lambda: |-
          id(influx_enable) = false;

  - platform: template
    name: "SD card logging"
    id: switch_sd
    web_server:
      sorting_group_id: sort_device_settings
    restore_mode: DISABLED
    icon: mdi:sd
    lambda: |-
      return id(sd_enable);
    turn_on_action:
      - lambda: |-
          id(sd_enable) = true;
    turn_off_action:
      - lambda: |-
          id(sd_enable) = false;

  - platform: template
    name: "Automatic updates"
    id: switch_updates
    web_server:
      sorting_group_id: sort_device_settings
    restore_mode: DISABLED
    icon: mdi:update
    lambda: |-
      return id(updates_enable);
    turn_on_action:
      - lambda: |-
          id(updates_enable) = true;
    turn_off_action:
      - lambda: |-
          id(updates_enable) = false;

